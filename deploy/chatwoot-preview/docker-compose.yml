name: unica-chatwoot

networks:
  default:
    name: unica-chatwoot-net

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unica-chatwoot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chatwoot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chatwoot_production
    volumes:
      - /data/unica-chatwoot/pgdata:/var/lib/postgresql/data
    mem_limit: 512m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatwoot"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: unica-chatwoot-redis
    restart: unless-stopped
    mem_limit: 128m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rails:
    image: chatwoot/chatwoot:v3.15.0
    container_name: unica-chatwoot-rails
    restart: unless-stopped
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    env_file: .env
    volumes:
      - /data/unica-chatwoot/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1200m
    oom_score_adj: 500

  nginx:
    image: nginx:alpine
    container_name: unica-chatwoot-nginx
    restart: unless-stopped
    ports:
      - "3400:80"
      - "3401:8082"
    volumes:
      - /data/unica-chatwoot/compose/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /data/unica-chatwoot/portal:/usr/share/nginx/portal:ro
    depends_on:
      - rails
      - admin
    mem_limit: 64m
    oom_score_adj: 500

  admin:
    image: alpine:3.19
    container_name: unica-admin
    restart: unless-stopped
    command: ["/usr/local/bin/unica-admin"]
    environment:
      ADMIN_PORT: "8081"
      DATABASE_URL: "postgres://chatwoot:${POSTGRES_PASSWORD}@postgres:5432/unica?sslmode=disable"
      REDIS_URL: "redis://redis:6379/1"
      JWT_SECRET: "${ADMIN_JWT_SECRET}"
      AES_ENCRYPTION_KEY: "${ADMIN_AES_KEY}"
      GATEWAY_HOST: "100.98.57.55:8080"
      DIFY_ADMIN_URL: "http://100.122.83.20:3402/console/api"
      DIFY_API_BASE_URL: "http://100.122.83.20:3402/v1"
      DIFY_ADMIN_EMAIL: "admin@unica.local"
      # Set in the deployment host's .env; compose fails loudly when missing.
      DIFY_ADMIN_PASSWORD: "${DIFY_ADMIN_PASSWORD:?DIFY_ADMIN_PASSWORD required}"
      # Dataset-type key from the Dify knowledge base API page. The app keys
      # stored per product line are rejected by the dataset endpoints; leaving
      # this empty disables knowledge base management instead of failing.
      DIFY_DATASET_API_KEY: "${DIFY_DATASET_API_KEY:-}"
      # "high_quality" needs an embedding model configured in the Dify
      # workspace; a deployment whose model provider has no embeddings (e.g.
      # DeepSeek-only) must set "economy" or every knowledge upload is refused.
      DIFY_INDEXING_TECHNIQUE: "${DIFY_INDEXING_TECHNIQUE:-high_quality}"
      # Chatwoot deployment onboarding provisions tenants in, reached inside the
      # compose network so no public hop is involved.
      CHATWOOT_BASE_URL: "http://rails:3000"
      # Access token of a platform app created in the Chatwoot super admin
      # console; empty leaves customer onboarding without a Chatwoot step.
      CHATWOOT_PLATFORM_TOKEN: "${CHATWOOT_PLATFORM_TOKEN:-}"
      # Callback baked into every provisioned API inbox, so it must be the
      # gateway address Chatwoot itself can reach.
      CHATWOOT_WEBHOOK_URL: "http://100.98.57.55:8080/api/v1/webhook/chatwoot"
    volumes:
      - /data/unica-chatwoot/admin/unica-admin:/usr/local/bin/unica-admin:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 256m
    oom_score_adj: 500

  sidekiq:
    image: chatwoot/chatwoot:v3.15.0
    container_name: unica-chatwoot-sidekiq
    restart: unless-stopped
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    env_file: .env
    volumes:
      - /data/unica-chatwoot/storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    oom_score_adj: 500
