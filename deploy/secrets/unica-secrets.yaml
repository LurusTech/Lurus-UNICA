# WARNING: This is a template. Replace placeholder values before applying.
# For production, use sealed-secrets or external secret management.
#
# Generate passwords:
#   openssl rand -base64 24
#
apiVersion: v1
kind: Secret
metadata:
  name: unica-db-credentials
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
type: Opaque
stringData:
  # PostgreSQL
  POSTGRES_PASSWORD: "CHANGE_ME_postgres_password"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "unica_core"
  POSTGRES_URI: "postgresql://postgres:CHANGE_ME_postgres_password@postgresql.unica-dev.svc.cluster.local:5432/unica_core?sslmode=disable"
  # Redis
  REDIS_PASSWORD: "CHANGE_ME_redis_password"
  REDIS_URI: "redis://:CHANGE_ME_redis_password@redis-master.unica-dev.svc.cluster.local:6379"
