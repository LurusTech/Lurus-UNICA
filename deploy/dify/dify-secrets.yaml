# WARNING: This is a template. Replace placeholder values before applying.
# Generate secrets:
#   openssl rand -base64 42
#   openssl rand -hex 32
#
apiVersion: v1
kind: Secret
metadata:
  name: dify-secrets
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
    app.kubernetes.io/component: dify
type: Opaque
stringData:
  # Dify PostgreSQL credentials
  DB_USERNAME: "dify"
  DB_PASSWORD: "CHANGE_ME_dify_db_password"
  DB_HOST: "postgresql.unica-dev.svc.cluster.local"
  DB_PORT: "5432"
  DB_DATABASE: "dify_db"

  # Redis credentials (shared Redis instance)
  REDIS_HOST: "redis-master.unica-dev.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "CHANGE_ME_redis_password"

  # Dify secret key for encryption
  SECRET_KEY: "CHANGE_ME_dify_secret_key_use_openssl_rand_hex_32"

  # Dify sandbox API key
  SANDBOX_API_KEY: "dify-sandbox"

  # Dify internal API key (for worker <-> api communication)
  INNER_API_KEY: "CHANGE_ME_inner_api_key"

  # pgvector configuration (same DB as Dify)
  PGVECTOR_HOST: "postgresql.unica-dev.svc.cluster.local"
  PGVECTOR_PORT: "5432"
  PGVECTOR_USER: "dify"
  PGVECTOR_PASSWORD: "CHANGE_ME_dify_db_password"
  PGVECTOR_DATABASE: "dify_db"
