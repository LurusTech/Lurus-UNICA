# Dify Web - Frontend UI (Next.js)
# Provides the admin console and app builder interface
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-web
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
    app.kubernetes.io/component: dify
    app.kubernetes.io/name: dify-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dify-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: unica
        app.kubernetes.io/component: dify
        app.kubernetes.io/name: dify-web
    spec:
      containers:
        - name: dify-web
          image: langgenius/dify-web:0.15.3
          ports:
            - containerPort: 3000
              name: http
              protocol: TCP
          env:
            # Console API URL - point to the dify-api service
            - name: CONSOLE_API_URL
              value: ""
            - name: APP_API_URL
              value: ""

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: dify-web
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
    app.kubernetes.io/component: dify
    app.kubernetes.io/name: dify-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dify-web
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
