# Dify Nginx - Reverse proxy to unify API and Web access
# Routes /api, /v1, /console/api to dify-api, everything else to dify-web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dify-nginx-config
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
    app.kubernetes.io/component: dify
    app.kubernetes.io/name: dify-nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent"';
        access_log /var/log/nginx/access.log main;

        sendfile on;
        keepalive_timeout 65;
        client_max_body_size 15M;

        # Dify API upstream
        upstream dify_api {
            server dify-api:5001;
        }

        # Dify Web upstream
        upstream dify_web {
            server dify-web:3000;
        }

        server {
            listen 80;
            server_name _;

            # Proxy settings
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;

            # API routes -> dify-api
            location /console/api {
                proxy_pass http://dify_api;
            }

            location /api {
                proxy_pass http://dify_api;
            }

            location /v1 {
                proxy_pass http://dify_api;
            }

            location /files {
                proxy_pass http://dify_api;
            }

            # SSE (Server-Sent Events) support for streaming responses
            location ~* ^/(v1|api)/.*$ {
                proxy_pass http://dify_api;
                proxy_set_header Connection '';
                proxy_set_header Cache-Control 'no-cache';
                proxy_set_header X-Accel-Buffering 'no';
                chunked_transfer_encoding on;
            }

            # Everything else -> dify-web
            location / {
                proxy_pass http://dify_web;
            }
        }
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-nginx
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
    app.kubernetes.io/component: dify
    app.kubernetes.io/name: dify-nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dify-nginx
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: unica
        app.kubernetes.io/component: dify
        app.kubernetes.io/name: dify-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

      volumes:
        - name: nginx-config
          configMap:
            name: dify-nginx-config

---
apiVersion: v1
kind: Service
metadata:
  name: dify-nginx
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
    app.kubernetes.io/component: dify
    app.kubernetes.io/name: dify-nginx
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dify-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30001
      protocol: TCP
