# Dify Worker - Async task processor (Celery)
# Handles embeddings, document indexing, and other background tasks
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-worker
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
    app.kubernetes.io/component: dify
    app.kubernetes.io/name: dify-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dify-worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: unica
        app.kubernetes.io/component: dify
        app.kubernetes.io/name: dify-worker
    spec:
      containers:
        - name: dify-worker
          image: langgenius/dify-api:0.15.3
          env:
            # Worker mode
            - name: MODE
              value: "worker"

            # Database configuration
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: DB_PORT
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: DB_DATABASE

            # Redis configuration
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: REDIS_HOST
            - name: REDIS_PORT
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: REDIS_PORT
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: REDIS_PASSWORD
            - name: REDIS_DB
              value: "0"
            - name: REDIS_USE_SSL
              value: "false"

            # Celery broker
            - name: CELERY_BROKER_URL
              value: ""
            - name: BROKER_USE_SSL
              value: "false"

            # Secret key
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: SECRET_KEY

            # Vector store - pgvector
            - name: VECTOR_STORE
              value: "pgvector"
            - name: PGVECTOR_HOST
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: PGVECTOR_HOST
            - name: PGVECTOR_PORT
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: PGVECTOR_PORT
            - name: PGVECTOR_USER
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: PGVECTOR_USER
            - name: PGVECTOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: PGVECTOR_PASSWORD
            - name: PGVECTOR_DATABASE
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: PGVECTOR_DATABASE

            # Storage
            - name: STORAGE_TYPE
              value: "local"
            - name: STORAGE_LOCAL_PATH
              value: "/app/api/storage"

            # Sandbox
            - name: CODE_EXECUTION_ENDPOINT
              value: "http://dify-sandbox:8194"
            - name: CODE_EXECUTION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: SANDBOX_API_KEY

            # Inner API key
            - name: INNER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: INNER_API_KEY

            # Log level
            - name: LOG_LEVEL
              value: "INFO"

          volumeMounts:
            - name: dify-storage
              mountPath: /app/api/storage

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi

      volumes:
        - name: dify-storage
          persistentVolumeClaim:
            claimName: dify-storage
