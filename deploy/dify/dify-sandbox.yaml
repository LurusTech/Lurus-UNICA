# Dify Sandbox - Code execution sandbox for Dify
# Provides isolated environment for running user code in workflows
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dify-sandbox
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
    app.kubernetes.io/component: dify
    app.kubernetes.io/name: dify-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: dify-sandbox
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: unica
        app.kubernetes.io/component: dify
        app.kubernetes.io/name: dify-sandbox
    spec:
      containers:
        - name: dify-sandbox
          image: langgenius/dify-sandbox:0.2.10
          ports:
            - containerPort: 8194
              name: http
              protocol: TCP
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: dify-secrets
                  key: SANDBOX_API_KEY
            - name: GIN_MODE
              value: "release"
            - name: WORKER_TIMEOUT
              value: "15"
            - name: ENABLE_NETWORK
              value: "true"
            - name: HTTP_PROXY
              value: "http://dify-ssrf-proxy:3128"
            - name: HTTPS_PROXY
              value: "http://dify-ssrf-proxy:3128"
            - name: SANDBOX_PORT
              value: "8194"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi

          readinessProbe:
            tcpSocket:
              port: 8194
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            tcpSocket:
              port: 8194
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: dify-sandbox
  namespace: unica-dev
  labels:
    app.kubernetes.io/part-of: unica
    app.kubernetes.io/component: dify
    app.kubernetes.io/name: dify-sandbox
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dify-sandbox
  ports:
    - name: http
      port: 8194
      targetPort: 8194
      protocol: TCP
