server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain text/css text/xml application/json
        application/javascript application/xml+rss
        image/svg+xml application/manifest+json;

    location /console/api {
        proxy_pass http://api:5001;
        include /etc/nginx/proxy_params_dify;
    }

    location /api {
        proxy_pass http://api:5001;
        include /etc/nginx/proxy_params_dify;
    }

    location /v1 {
        proxy_pass http://api:5001;
        include /etc/nginx/proxy_params_dify;
    }

    location /files {
        proxy_pass http://api:5001;
        include /etc/nginx/proxy_params_dify;
    }

    # Seeds a console session minted by the admin service, so an administrator
    # arriving from the platform page is already signed in here. The tokens
    # travel in the URL fragment: a fragment is never sent to a server, so it
    # stays out of this access log and out of any Referer. The page drops it
    # from the address bar before leaving, so it does not sit in history either.
    #
    # Three keys, not two. The console frontend gates on setup_status before it
    # will render anything, and falls back to an async check that has not
    # returned by first paint — a browser without the key is sent to /install
    # even though this instance was set up long ago. Writing it here is sound:
    # the session was minted by logging in, and a login only succeeds against an
    # instance that finished installing. Dify's own logout clears all three
    # together, which is the same set seen from the other side.
    location = /unica/console-entry {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        return 200 '<!doctype html><html lang="zh"><head><meta charset="utf-8"><title>正在进入 Dify 控制台</title></head><body style="font-family:system-ui,sans-serif;padding:40px;color:#333"><p id="m">正在进入 Dify 控制台…</p><script>(function(){var h=window.location.hash.replace(/^#/,"");var p=new URLSearchParams(h);var a=p.get("a");var r=p.get("r");var m=document.getElementById("m");if(!a||!r){m.textContent="请从平台管理页的 Dify 控制台卡片进入。";return;}try{localStorage.setItem("console_token",a);localStorage.setItem("refresh_token",r);localStorage.setItem("setup_status","finished");}catch(e){m.textContent="浏览器阻止了本地存储，无法免密进入。";return;}history.replaceState(null,"",window.location.pathname);window.location.replace("/apps");})();</script></body></html>';
    }

    location / {
        proxy_pass http://web:3000;
        include /etc/nginx/proxy_params_dify;
    }
}
