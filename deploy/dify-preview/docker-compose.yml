name: unica-dify

networks:
  default:
    name: unica-dify-net

x-api-env: &api-env
  CONSOLE_API_URL: "http://100.122.83.20:3402"
  CONSOLE_WEB_URL: "http://100.122.83.20:3402"
  SERVICE_API_URL: "http://100.122.83.20:3402"
  APP_WEB_URL: "http://100.122.83.20:3402"
  DB_USERNAME: dify
  DB_PASSWORD: "262366c174474c6006ee00b75d6830ad"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: dify_db
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  REDIS_USE_SSL: "false"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  BROKER_USE_SSL: "false"
  SECRET_KEY: "RwrSceUVbJ0n/GRbN1gE/P6xwdoqbslHnDeYn5eJvLlEran9Dnm+7XBV"
  VECTOR_STORE: pgvector
  PGVECTOR_HOST: postgres
  PGVECTOR_PORT: "5432"
  PGVECTOR_USER: dify
  PGVECTOR_PASSWORD: "262366c174474c6006ee00b75d6830ad"
  PGVECTOR_DATABASE: dify_db
  STORAGE_TYPE: local
  STORAGE_LOCAL_PATH: /app/api/storage
  CODE_EXECUTION_ENDPOINT: "http://sandbox:8194"
  CODE_EXECUTION_API_KEY: "466d7d73b24e98370440d53b72dbf90a"
  LOG_LEVEL: INFO
  INNER_API_KEY: "d4afb53d65db920a67e2b266e22f50dc"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unica-dify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dify
      POSTGRES_PASSWORD: "262366c174474c6006ee00b75d6830ad"
      POSTGRES_DB: dify_db
    volumes:
      - /data/unica-dify/pgdata:/var/lib/postgresql/data
      - /data/unica-dify/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dify -d dify_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: unica-dify-redis
    restart: unless-stopped
    mem_limit: 128m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: langgenius/dify-api:0.15.3
    container_name: unica-dify-api
    restart: unless-stopped
    environment:
      <<: *api-env
      MODE: api
      MIGRATION_ENABLED: "true"
    volumes:
      - /data/unica-dify/storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1536m
    oom_score_adj: 500

  worker:
    image: langgenius/dify-api:0.15.3
    container_name: unica-dify-worker
    restart: unless-stopped
    environment:
      <<: *api-env
      MODE: worker
      MIGRATION_ENABLED: "false"
    volumes:
      - /data/unica-dify/storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    oom_score_adj: 500

  web:
    image: langgenius/dify-web:0.15.3
    container_name: unica-dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: "http://100.122.83.20:3402"
      APP_API_URL: "http://100.122.83.20:3402"
    mem_limit: 400m
    oom_score_adj: 500

  sandbox:
    image: langgenius/dify-sandbox:0.2.10
    container_name: unica-dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: "466d7d73b24e98370440d53b72dbf90a"
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
    mem_limit: 300m
    oom_score_adj: 500

  nginx:
    image: nginx:alpine
    container_name: unica-dify-nginx
    restart: unless-stopped
    ports:
      - "3402:80"
    volumes:
      - /data/unica-dify/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /data/unica-dify/proxy_params_dify:/etc/nginx/proxy_params_dify:ro
    depends_on:
      - api
      - web
    mem_limit: 64m
    oom_score_adj: 500
