# Dify preview stack.
#
# Parameterised so one file serves both a local WSL machine and a remote preview
# host: everything host-specific comes from .env (see .env.example). The previous
# revision hard-coded a single tailnet address, which meant a second environment
# had to fork the file and then drift from it.
#
#   cp .env.example .env && edit
#   docker compose up -d
#
# Dify is pinned to 0.15.3 deliberately: it is the version the router's bridge
# code was written and tested against, including the known UpdateAppConfig
# behaviour recorded in doc/active_task.md.

name: unica-dify

networks:
  default:
    name: unica-dify-net

x-api-env: &api-env
  CONSOLE_API_URL: "${DIFY_PUBLIC_URL}"
  CONSOLE_WEB_URL: "${DIFY_PUBLIC_URL}"
  SERVICE_API_URL: "${DIFY_PUBLIC_URL}"
  APP_WEB_URL: "${DIFY_PUBLIC_URL}"
  DB_USERNAME: "${POSTGRES_USER}"
  DB_PASSWORD: "${POSTGRES_PASSWORD}"
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_DATABASE: "${POSTGRES_DB}"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ""
  REDIS_DB: "0"
  REDIS_USE_SSL: "false"
  CELERY_BROKER_URL: "redis://redis:6379/1"
  BROKER_USE_SSL: "false"
  SECRET_KEY: "${DIFY_SECRET_KEY}"
  VECTOR_STORE: pgvector
  PGVECTOR_HOST: postgres
  PGVECTOR_PORT: "5432"
  PGVECTOR_USER: "${POSTGRES_USER}"
  PGVECTOR_PASSWORD: "${POSTGRES_PASSWORD}"
  PGVECTOR_DATABASE: "${POSTGRES_DB}"
  STORAGE_TYPE: local
  STORAGE_LOCAL_PATH: /app/api/storage
  CODE_EXECUTION_ENDPOINT: "http://sandbox:8194"
  CODE_EXECUTION_API_KEY: "${SANDBOX_API_KEY}"
  LOG_LEVEL: INFO
  INNER_API_KEY: "${DIFY_INNER_API_KEY}"

services:
  # Serves Dify and, in a preview environment, the UNICA business database as a
  # second database on the same instance. Keeping them together is a preview
  # convenience, not a production pattern.
  postgres:
    image: pgvector/pgvector:pg16
    container_name: unica-dify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    ports:
      # Exposed so the router, the evaluation harness and the ontology CLI can
      # reach it from the host without entering a container.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - ${DIFY_DATA_DIR}/pgdata:/var/lib/postgresql/data
      - ${DIFY_DATA_DIR}/initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 512m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: unica-dify-redis
    restart: unless-stopped
    mem_limit: 128m
    oom_score_adj: 500
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: langgenius/dify-api:0.15.3
    container_name: unica-dify-api
    restart: unless-stopped
    environment:
      <<: *api-env
      MODE: api
      MIGRATION_ENABLED: "true"
    volumes:
      - ${DIFY_DATA_DIR}/storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1536m
    oom_score_adj: 500

  worker:
    image: langgenius/dify-api:0.15.3
    container_name: unica-dify-worker
    restart: unless-stopped
    environment:
      <<: *api-env
      MODE: worker
      MIGRATION_ENABLED: "false"
    volumes:
      - ${DIFY_DATA_DIR}/storage:/app/api/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g
    oom_score_adj: 500

  web:
    image: langgenius/dify-web:0.15.3
    container_name: unica-dify-web
    restart: unless-stopped
    environment:
      CONSOLE_API_URL: "${DIFY_PUBLIC_URL}"
      APP_API_URL: "${DIFY_PUBLIC_URL}"
    mem_limit: 400m
    oom_score_adj: 500

  sandbox:
    image: langgenius/dify-sandbox:0.2.10
    container_name: unica-dify-sandbox
    restart: unless-stopped
    environment:
      API_KEY: "${SANDBOX_API_KEY}"
      GIN_MODE: release
      WORKER_TIMEOUT: "15"
    mem_limit: 300m
    oom_score_adj: 500

  nginx:
    image: nginx:alpine
    container_name: unica-dify-nginx
    restart: unless-stopped
    ports:
      - "${DIFY_PORT:-3402}:80"
    volumes:
      - ${DIFY_DATA_DIR}/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DIFY_DATA_DIR}/proxy_params_dify:/etc/nginx/proxy_params_dify:ro
    depends_on:
      - api
      - web
    mem_limit: 64m
    oom_score_adj: 500
