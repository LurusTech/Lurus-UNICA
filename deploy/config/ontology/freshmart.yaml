# Domain ontology for the FreshMart product line.
#
# The most consequential file of the three: FreshMart has NO no-questions-asked
# return policy and NO warranty, while both sibling lines have both. Those two
# absences are the single most likely wrong answer the system can give, because
# a 7-day return window is the default assumption in Chinese e-commerce and the
# model will supply it unprompted.
#
# Closed world plus the explicit denials below are what stop that: the property
# is simply not declared, so any claim about it is a violation, and the injected
# context states the absence out loud instead of leaving a gap to fill.

product_line: FreshMart
version: 1

classes:
  FreshProduct:
    label: 生鲜商品

properties:
  quality_claim_window_hours:
    label: 质量问题申报窗口
    domain: FreshProduct
    range: {type: integer, unit: hour, values: ["24"]}
    functional: true

  return_precondition:
    label: 退款前置条件
    domain: FreshProduct
    range:
      type: enum
      values: [quality_defect, photo_evidence]
      # Identifiers stay machine-comparable; the labels are what a customer reads.
      labels: {quality_defect: 质量问题, photo_evidence: 拍照取证}
    min_cardinality: 1

  refund_arrival_hours:
    label: 退款到账时间
    domain: FreshProduct
    range: {type: integer, unit: hour, values: ["24"]}
    functional: true

  shipping_method:
    label: 配送方式
    domain: FreshProduct
    range: {type: enum, values: [冷链配送]}
    functional: true

  shipping_local:
    label: 同城时效
    domain: FreshProduct
    range: {type: enum, values: [同城当日达]}
    functional: true

  shipping_remote:
    label: 外地时效
    domain: FreshProduct
    range: {type: enum, values: [外地次日达]}
    functional: true

  express_hours:
    label: 加急时效
    domain: FreshProduct
    # Stored in the unit the answer should use: the model copies the rendered
    # value verbatim, so "120分钟" in the ontology becomes "120分钟" to a customer
    # where the canned response says 2 小时.
    range: {type: integer, unit: hour, values: ["2"]}
    functional: true

  express_scope:
    label: 加急适用范围
    domain: FreshProduct
    range: {type: enum, values: [限同城]}
    functional: true

  express_fee_yuan:
    label: 加急配送费
    domain: FreshProduct
    range: {type: integer, unit: yuan, values: ["10"]}
    functional: true

  payment_method:
    label: 支付方式
    domain: FreshProduct
    range: {type: enum, values: [微信支付, 支付宝, 银行卡, 货到付款]}
    min_cardinality: 1

  freshness:
    label: 新鲜度保证
    domain: FreshProduct
    range: {type: enum, values: [当日采购]}
    functional: true

  hotline:
    label: 客服热线
    domain: FreshProduct
    range: {type: enum, values: ["400-200-0002"]}
    functional: true

  service_hours:
    label: 服务时间
    domain: FreshProduct
    range: {type: enum, values: ["每天 7:00-22:00"]}
    functional: true

# ---- Handoff intake: three properties, no more. facts_context is injected
# unconditionally on every turn, so anything added here competes with the
# policy facts above (24h window, no warranty, no no-questions-asked return)
# for the model's attention. An earlier revision spent fifteen properties on
# per-scenario checklists and buried those policy facts; the checklists are
# now one compact table. Keep this block under ~1200 characters.

  转人工采集通则:
    label: 转人工前信息采集通则
    range:
      type: enum
      values:
        - "一轮最多问3项且合并为一次提问；不重复询问客户已提供过的信息；最多追问2轮，客户拒绝配合即转人工并在工单注明信息不全。金额、是否赔付、能否受理一律由人工核定，客服助手不作承诺、不判断某笔申请能否通过；可说明政策口径与所需举证材料，但不得计算金额。"
    functional: true

  分场景必问项:
    label: 各转人工场景的必问信息（括号内为最关键项）
    range:
      type: enum
      values:
        - "坏损退款：订单号、商品名称、坏损数量或比例、签收时间、是否拍照（数量最关键）；超窗投诉：订单号、签收时间、发现问题时间、是否拍照（两者间隔最关键）；缺件缺重：订单号、商品名称、数量差额或实际称重、是否拍照、外包装是否完好（差额数字最关键）；冷链失效：订单号、商品名称、签收时包装与冰袋状态、签收时间与商品温度、是否拍照（温度状态最关键）；加急超时：订单号、下单时间与承诺时限、实际送达时间或当前物流状态、是否改约或无人签收（实际送达时间最关键）；配送延误：订单号、承诺时效、当前物流状态、是否已变质（是否变质最关键）；错发漏发：订单号、应收与实收商品、是否开封或食用、签收时间（是否开封最关键）；货到付款退款：订单号、现金还是收款码、付款金额与凭证、签收时间（付款方式最关键，账户信息由人工核实）；批次质量：订单号、商品名称、生产日期或批次标识、异常表现、是否拍照（批次标识最关键）；退款催办：订单号、申请时间与审核通过时间、原支付方式、是否已查支付渠道账单（两个时间最关键）。"
    functional: true

  跳过采集的例外情形:
    label: 跳过采集立即转人工的三类情形
    range:
      type: enum
      values:
        - "三类跳过采集立即转人工：一是食品安全事件（食用后不适、腹泻呕吐、过敏、异物、疑似中毒，或涉及儿童孕妇老人），最多只问身体状况与是否就医、订单号两项即转，不得给医疗建议或谈赔偿；二是情绪激烈或提及12315、市场监管、消协、媒体曝光，先致歉共情，最多只确认订单号一项即转，不得给赔付结论或劝阻投诉；三是客户明确要求转人工，不再采集直接转。"
    functional: true

# Deliberately absent: return_window_days, warranty_months. Their absence is the
# assertion, not an omission.
assertions:
  - class: FreshProduct
    values:
      quality_claim_window_hours: 24
      return_precondition: [quality_defect, photo_evidence]
      refund_arrival_hours: 24
      shipping_method: 冷链配送
      shipping_local: 同城当日达
      shipping_remote: 外地次日达
      express_hours: 2
      express_scope: 限同城
      express_fee_yuan: 10
      payment_method: [微信支付, 支付宝, 银行卡, 货到付款]
      freshness: 当日采购
      hotline: "400-200-0002"
      service_hours: "每天 7:00-22:00"

  # Intake rules hold for every conversation, so they are asserted
  # unconditionally rather than under the FreshProduct class.
  - values:
      转人工采集通则: "一轮最多问3项且合并为一次提问；不重复询问客户已提供过的信息；最多追问2轮，客户拒绝配合即转人工并在工单注明信息不全。金额、是否赔付、能否受理一律由人工核定，客服助手不作承诺、不判断某笔申请能否通过；可说明政策口径与所需举证材料，但不得计算金额。"
      分场景必问项: "坏损退款：订单号、商品名称、坏损数量或比例、签收时间、是否拍照（数量最关键）；超窗投诉：订单号、签收时间、发现问题时间、是否拍照（两者间隔最关键）；缺件缺重：订单号、商品名称、数量差额或实际称重、是否拍照、外包装是否完好（差额数字最关键）；冷链失效：订单号、商品名称、签收时包装与冰袋状态、签收时间与商品温度、是否拍照（温度状态最关键）；加急超时：订单号、下单时间与承诺时限、实际送达时间或当前物流状态、是否改约或无人签收（实际送达时间最关键）；配送延误：订单号、承诺时效、当前物流状态、是否已变质（是否变质最关键）；错发漏发：订单号、应收与实收商品、是否开封或食用、签收时间（是否开封最关键）；货到付款退款：订单号、现金还是收款码、付款金额与凭证、签收时间（付款方式最关键，账户信息由人工核实）；批次质量：订单号、商品名称、生产日期或批次标识、异常表现、是否拍照（批次标识最关键）；退款催办：订单号、申请时间与审核通过时间、原支付方式、是否已查支付渠道账单（两个时间最关键）。"
      跳过采集的例外情形: "三类跳过采集立即转人工：一是食品安全事件（食用后不适、腹泻呕吐、过敏、异物、疑似中毒，或涉及儿童孕妇老人），最多只问身体状况与是否就医、订单号两项即转，不得给医疗建议或谈赔偿；二是情绪激烈或提及12315、市场监管、消协、媒体曝光，先致歉共情，最多只确认订单号一项即转，不得给赔付结论或劝阻投诉；三是客户明确要求转人工，不再采集直接转。"

denies:
  - term: 无理由退货
    note: 生鲜商品不适用，质量问题请在签收后 24 小时内拍照联系客服，审核通过全额退款
  - term: 质保
    note: 生鲜商品无质保概念，质量问题走 24 小时申报
  - term: 分期付款
  - term: 顺丰
    note: 生鲜使用冷链配送
