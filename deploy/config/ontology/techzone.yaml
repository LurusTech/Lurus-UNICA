# Domain ontology for the TechZone product line.
#
# The only line with a conditional return policy (15 days, unopened only) and a
# split warranty (phones 12 months, accessories 6). Both are routinely flattened
# by the model: the precondition gets dropped, and the two warranty tiers get
# merged into one number.
#
# The class hierarchy exists for exactly that second reason — warranty_months is
# asserted on the subclasses, not on the parent, so the most specific assertion
# decides. Phone and Accessory are declared disjoint so an answer cannot apply
# one tier's rules to the other.

product_line: TechZone
version: 1

classes:
  DigitalProduct:
    label: 数码产品
  Phone:
    label: 手机
    subclass_of: DigitalProduct
  Accessory:
    label: 配件
    subclass_of: DigitalProduct

disjoint:
  - [Phone, Accessory]

properties:
  return_window_days:
    label: 无理由退货窗口
    domain: DigitalProduct
    range: {type: integer, unit: day, values: ["15"]}
    functional: true
    # Quoting 15 days without the precondition is accurate and still misleading:
    # a customer who has opened the box will act on a policy that does not cover
    # them. The two facts must travel together.
    requires: [return_precondition]

  return_precondition:
    label: 退货前置条件
    domain: DigitalProduct
    range:
      type: enum
      values: [unopened]
      labels: {unopened: 未拆封}
    min_cardinality: 1

  post_open_remedy:
    label: 拆封后的救济途径
    domain: DigitalProduct
    range: {type: enum, values: [保修]}
    functional: true

  return_process_requirement:
    label: 退货流程要求
    domain: DigitalProduct
    range: {type: enum, values: [保留完整包装, 检测通过后退款]}
    min_cardinality: 1

  # Not pinned to a single value: the two subclasses carry different tiers, and
  # the bounds only reject implausible ones.
  warranty_months:
    label: 保修期
    domain: DigitalProduct
    range: {type: integer, unit: month, min: 1, max: 36}
    functional: true

  shipping_carrier:
    label: 承运商
    domain: DigitalProduct
    range: {type: enum, values: [顺丰]}
    functional: true

  shipping_standard_days:
    label: 标准快递时效
    domain: DigitalProduct
    range: {type: enum, unit: workday, values: ["2-3"]}
    functional: true

  shipping_express:
    label: 加急时效
    domain: DigitalProduct
    range: {type: enum, values: [次日达]}
    functional: true

  # An enum, not a number: TechZone has no fixed express fee, and pinning the
  # only legal answer to 到付 is what rejects a figure borrowed from a sibling
  # line (MegaStore 15 元 / FreshMart 10 元).
  shipping_express_fee:
    label: 加急运费
    domain: DigitalProduct
    range: {type: enum, values: [到付]}
    functional: true

  installment_periods:
    label: 分期期数
    domain: DigitalProduct
    range: {type: integer, unit: period, values: ["6", "12", "24"]}
    min_cardinality: 1

  payment_method:
    label: 支付方式
    domain: DigitalProduct
    range: {type: enum, values: [微信支付, 支付宝, 银行卡]}
    min_cardinality: 1

  tech_support:
    label: 技术支持方式
    domain: DigitalProduct
    range: {type: enum, values: [快速入门指南, 远程协助]}
    min_cardinality: 1

  hotline:
    label: 技术支持热线
    domain: DigitalProduct
    range: {type: enum, values: ["400-300-0003"]}
    functional: true

  service_hours:
    label: 服务时间
    domain: DigitalProduct
    range: {type: enum, values: ["周一至周日 9:00-21:00"]}
    functional: true

  # ---- 转人工前信息采集（规则 9 的落地引用点） ----
  # 这三条零售线尚未接入知识库数据集，采集清单无法作为检索文档落地，
  # 因此改挂本体。facts_context 无条件注入，篇幅必须压到最小，
  # 否则会淹没保修期、退货窗口、支付方式等真正的政策事实。

  转人工采集通则:
    label: 转人工采集通则
    domain: DigitalProduct
    range:
      type: enum
      values:
        - "一轮最多问 3 项，不重复询问客户已提供过的信息，最多追问 2 轮；客户拒绝配合或答非所问即转人工并在工单注明信息不全，不得以采集为由拖延转接。金额与是否赔付一律由人工核定，客服助手不作承诺、不判断某笔申请能否通过，可说明所需举证材料但不计算金额。采集到的信息随工单一并提交。"
    functional: true

  分场景必问项:
    label: 分场景转人工必问项
    domain: DigitalProduct
    range:
      type: enum
      values:
        - "坏损碎屏：订单号机型、签收时间、外包装与封口贴是否完好（最关键）、有无开箱视频；进水拒保：序列号、购买时间、送修网点与检测单号（最关键）、检测结论原文；疑似翻新机：订单号、机身序列号或 IMEI（最关键）、官网激活时间截图、封条与配件是否完好；保修争议：订单号机型、购买时间（最关键，区分手机 12 个月与配件 6 个月）、故障表现、有无摔落进水或第三方拆修；以旧换新估价：换新单号、旧机型号与成色、实际估价与逐项扣减明细（最关键）、旧机当前位置；分期扣款：订单号与期数、支付渠道、异常期次与扣款金额、交易流水截图（最关键）；错发不符：订单号与下单型号颜色容量、实收商品与序列号、是否已拆封激活（最关键）；显示已签收未收到：订单号与快递单号、签收时间与签收人、是否授权代收（最关键）、是否联系过派件员；价保补差：订单号与下单时间、降价发现时间与页面（时间间隔最关键）、是否同款同配置、是否用过优惠券；预售定金：订单号与付定金时间、页面标注发货时间（最关键）、当前订单状态、是否已付尾款；返修争议：维修单号机型、寄出与取回时间、寄修前配件清单或封箱照片（最关键）、缺失配件清单；退款到账：订单号或维修单号、申请时间与当时告知的进度（最关键）、原支付渠道、是否已查过账单记录"
    functional: true

  采集跳过例外:
    label: 跳过采集立即转人工的情形
    domain: DigitalProduct
    range:
      type: enum
      values:
        - "三类情形跳过采集立即转人工：一、电池起火鼓包冒烟、爆炸、漏电触电、过热烫伤等人身财产安全事故，最多只问是否有人受伤已就医、设备是否已断电移离可燃物两项即转，不提供医疗建议、不谈赔偿，可提醒保留设备与现场照片、勿送第三方拆修；二、客户情绪激烈或威胁投诉监管部门与媒体，最多问订单号一项即转；三、客户明确要求转人工，不再采集，立即转接。"
    functional: true

assertions:
  - class: DigitalProduct
    values:
      return_window_days: 15
      return_precondition: [unopened]
      post_open_remedy: 保修
      return_process_requirement: [保留完整包装, 检测通过后退款]
      shipping_carrier: 顺丰
      shipping_standard_days: "2-3"
      shipping_express: 次日达
      shipping_express_fee: 到付
      installment_periods: [6, 12, 24]
      payment_method: [微信支付, 支付宝, 银行卡]
      tech_support: [快速入门指南, 远程协助]
      hotline: "400-300-0003"
      service_hours: "周一至周日 9:00-21:00"

      # ---- 转人工前信息采集 ----
      转人工采集通则: "一轮最多问 3 项，不重复询问客户已提供过的信息，最多追问 2 轮；客户拒绝配合或答非所问即转人工并在工单注明信息不全，不得以采集为由拖延转接。金额与是否赔付一律由人工核定，客服助手不作承诺、不判断某笔申请能否通过，可说明所需举证材料但不计算金额。采集到的信息随工单一并提交。"
      分场景必问项: "坏损碎屏：订单号机型、签收时间、外包装与封口贴是否完好（最关键）、有无开箱视频；进水拒保：序列号、购买时间、送修网点与检测单号（最关键）、检测结论原文；疑似翻新机：订单号、机身序列号或 IMEI（最关键）、官网激活时间截图、封条与配件是否完好；保修争议：订单号机型、购买时间（最关键，区分手机 12 个月与配件 6 个月）、故障表现、有无摔落进水或第三方拆修；以旧换新估价：换新单号、旧机型号与成色、实际估价与逐项扣减明细（最关键）、旧机当前位置；分期扣款：订单号与期数、支付渠道、异常期次与扣款金额、交易流水截图（最关键）；错发不符：订单号与下单型号颜色容量、实收商品与序列号、是否已拆封激活（最关键）；显示已签收未收到：订单号与快递单号、签收时间与签收人、是否授权代收（最关键）、是否联系过派件员；价保补差：订单号与下单时间、降价发现时间与页面（时间间隔最关键）、是否同款同配置、是否用过优惠券；预售定金：订单号与付定金时间、页面标注发货时间（最关键）、当前订单状态、是否已付尾款；返修争议：维修单号机型、寄出与取回时间、寄修前配件清单或封箱照片（最关键）、缺失配件清单；退款到账：订单号或维修单号、申请时间与当时告知的进度（最关键）、原支付渠道、是否已查过账单记录"
      采集跳过例外: "三类情形跳过采集立即转人工：一、电池起火鼓包冒烟、爆炸、漏电触电、过热烫伤等人身财产安全事故，最多只问是否有人受伤已就医、设备是否已断电移离可燃物两项即转，不提供医疗建议、不谈赔偿，可提醒保留设备与现场照片、勿送第三方拆修；二、客户情绪激烈或威胁投诉监管部门与媒体，最多问订单号一项即转；三、客户明确要求转人工，不再采集，立即转接。"

  - class: Phone
    values:
      warranty_months: 12

  - class: Accessory
    values:
      warranty_months: 6

denies:
  - term: 货到付款
    note: 请使用微信支付、支付宝、银行卡，大额订单可分期
  - term: 冷链配送
