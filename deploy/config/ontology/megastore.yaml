# Domain ontology for the MegaStore product line.
#
# Facts of record come from deploy/config/canned_responses.yaml; a consistency
# test fails the build if the two drift apart. This file is the import format —
# the router reads the compiled row in ontology_versions, not this file.
#
# Import:  go run ./cmd/ontology import -dir ../../deploy/config/ontology
#
# Closed world is in force (the default): a property that is not declared below
# means MegaStore does not offer that capability at all, and the renderer denies
# it out loud rather than staying silent.

product_line: MegaStore
version: 1

classes:
  GeneralProduct:
    label: 商品

properties:
  return_window_days:
    label: 无理由退货窗口
    domain: GeneralProduct
    range: {type: integer, unit: day, values: ["7"]}
    functional: true

  refund_arrival_days:
    label: 退款到账时间
    domain: GeneralProduct
    range: {type: integer, unit: workday, values: ["3"]}
    functional: true

  warranty_months:
    label: 质保期
    domain: GeneralProduct
    range: {type: integer, unit: month, values: ["12"]}
    functional: true

  shipping_standard_days:
    label: 标准快递时效
    domain: GeneralProduct
    range: {type: enum, unit: workday, values: ["3-5"]}
    functional: true

  shipping_express_days:
    label: 加急快递时效
    domain: GeneralProduct
    range: {type: enum, unit: workday, values: ["1-2"]}
    functional: true

  shipping_express_fee_yuan:
    label: 加急运费
    domain: GeneralProduct
    range: {type: integer, unit: yuan, values: ["15"]}
    functional: true

  return_process_requirement:
    label: 退货流程
    domain: GeneralProduct
    range: {type: enum, values: [联系客服, 寄回商品]}
    min_cardinality: 1

  payment_method:
    label: 支付方式
    domain: GeneralProduct
    range: {type: enum, values: [微信支付, 支付宝, 银行卡]}
    min_cardinality: 1

  hotline:
    label: 客服热线
    domain: GeneralProduct
    range: {type: enum, values: ["400-100-0001"]}
    functional: true

  service_hours:
    label: 服务时间
    domain: GeneralProduct
    range: {type: enum, values: ["周一至周五 9:00-18:00"]}
    functional: true

  # ---- 转人工前信息采集（规则 9 引用的清单，压缩为 3 条无条件注入的属性）----
  # 这些属性不描述商品事实，而是描述转人工前的提问动作与边界。
  # facts_context 每轮无条件注入，因此必须保持极简，避免淹没真正的政策事实。

  转人工采集通则:
    label: 转人工前的信息采集通则
    range:
      type: enum
      values:
        - 转人工前先按分场景必问项补齐信息：一轮最多问 3 项、先问最关键项，不重复询问客户已提供过的信息，最多追问 2 轮；客户拒绝配合或答非所问即转人工并在工单注明信息不全，采集到的信息随工单提交。退款金额、是否赔付、能否退货退款一律由人工核定，客服助手不作承诺、不判断某笔申请能否通过。
    functional: true

  分场景必问项:
    label: 各转人工场景的必问项清单
    range:
      type: enum
      values:
        - 坏损退款：订单号、商品名称规格、破损部位与件数、签收时间、是否拍照（部位与件数最关键）；错发不符：订单号、下单规格与实收型号、是否已拆封使用、吊牌与序列号是否齐全（规格与实收的对应关系最关键）；丢件未签收：订单号、快递公司与运单号、轨迹最后更新时间与状态、是否显示签收及签收人（轨迹最后更新最关键）；保修争议：订单号、商品型号、购买或签收日期、故障表现与首次出现时间、是否摔碰进水或非官方维修（购买日期最关键）；退款未到账：订单号、审核通过通知时间、原支付方式、是否用券或积分抵扣（通知时间最关键）；缺件少发：订单号、实收清单与下单清单逐项核对、是否拆分包裹、外箱是否二次拆封（逐项核对结果最关键）；价保价差：订单号与下单时间、实付金额、看到的活动价与来源页面、是否有截图（活动价与来源页最关键）；疑似假货：订单号、型号与批次号或序列号、判断依据、是否已防伪查验、包装是否完整（批次号或序列号最关键）；订单取消缺货：订单号、收到通知的时间与渠道、款项是否退回、所用券与积分是否退回（通知时间与渠道最关键）；券与积分抵扣异常：订单号与实付金额、所用券面额或积分数、下单时是否显示已选中、使用门槛（是否已选中最关键）；签收后运损：订单号、签收时间与拆箱发现时间、签收方式、外箱是否破损（两个时间的间隔最关键）；定金预售取消：订单号、定金还是全款及尾款是否已付、页面标注发货时间是否超期、取消原因（支付性质与尾款最关键）。
    functional: true

  采集跳过情形:
    label: 跳过采集立即转人工的情形
    range:
      type: enum
      values:
        - 以下三类跳过采集立即转人工，不得以采集为由拖延：一、人身伤害或安全事故（漏电起火冒烟、电池鼓包发烫、器皿爆裂割伤、玩具零件误吞、家具倒塌砸伤、食用后不适），最多只问人身安全状况与订单号两项，涉电器同时提醒断电停用并远离，不作医疗或维修建议；二、情绪激烈或提到投诉监管部门与媒体曝光，最多问 1 项即转；三、客户明确要求转人工，不再追问直接转。
    functional: true

# No return_precondition is declared: MegaStore's 7-day window is unconditional.
# Under closed world, a claim that returns require unopened packaging is a
# violation rather than an unverifiable statement.
assertions:
  - class: GeneralProduct
    values:
      return_window_days: 7
      refund_arrival_days: 3
      warranty_months: 12
      shipping_standard_days: "3-5"
      shipping_express_days: "1-2"
      shipping_express_fee_yuan: 15
      return_process_requirement: [联系客服, 寄回商品]
      payment_method: [微信支付, 支付宝, 银行卡]
      hotline: "400-100-0001"
      service_hours: "周一至周五 9:00-18:00"

  # 采集规则与商品无关，作用于全线，因此不限定 class。
  - values:
      转人工采集通则: 转人工前先按分场景必问项补齐信息：一轮最多问 3 项、先问最关键项，不重复询问客户已提供过的信息，最多追问 2 轮；客户拒绝配合或答非所问即转人工并在工单注明信息不全，采集到的信息随工单提交。退款金额、是否赔付、能否退货退款一律由人工核定，客服助手不作承诺、不判断某笔申请能否通过。
      分场景必问项: 坏损退款：订单号、商品名称规格、破损部位与件数、签收时间、是否拍照（部位与件数最关键）；错发不符：订单号、下单规格与实收型号、是否已拆封使用、吊牌与序列号是否齐全（规格与实收的对应关系最关键）；丢件未签收：订单号、快递公司与运单号、轨迹最后更新时间与状态、是否显示签收及签收人（轨迹最后更新最关键）；保修争议：订单号、商品型号、购买或签收日期、故障表现与首次出现时间、是否摔碰进水或非官方维修（购买日期最关键）；退款未到账：订单号、审核通过通知时间、原支付方式、是否用券或积分抵扣（通知时间最关键）；缺件少发：订单号、实收清单与下单清单逐项核对、是否拆分包裹、外箱是否二次拆封（逐项核对结果最关键）；价保价差：订单号与下单时间、实付金额、看到的活动价与来源页面、是否有截图（活动价与来源页最关键）；疑似假货：订单号、型号与批次号或序列号、判断依据、是否已防伪查验、包装是否完整（批次号或序列号最关键）；订单取消缺货：订单号、收到通知的时间与渠道、款项是否退回、所用券与积分是否退回（通知时间与渠道最关键）；券与积分抵扣异常：订单号与实付金额、所用券面额或积分数、下单时是否显示已选中、使用门槛（是否已选中最关键）；签收后运损：订单号、签收时间与拆箱发现时间、签收方式、外箱是否破损（两个时间的间隔最关键）；定金预售取消：订单号、定金还是全款及尾款是否已付、页面标注发货时间是否超期、取消原因（支付性质与尾款最关键）。
      采集跳过情形: 以下三类跳过采集立即转人工，不得以采集为由拖延：一、人身伤害或安全事故（漏电起火冒烟、电池鼓包发烫、器皿爆裂割伤、玩具零件误吞、家具倒塌砸伤、食用后不适），最多只问人身安全状况与订单号两项，涉电器同时提醒断电停用并远离，不作医疗或维修建议；二、情绪激烈或提到投诉监管部门与媒体曝光，最多问 1 项即转；三、客户明确要求转人工，不再追问直接转。

denies:
  - term: 货到付款
    note: 请使用微信支付、支付宝或银行卡
  - term: 分期付款
  - term: 冷链配送
