# Canned response templates for Chatwoot quick replies.
# Each product line maps to a Chatwoot account and defines its own set of templates.
# The seed script reads this file and creates the canned responses via API.

product_lines:
  - name: "MegaStore"
    chatwoot_account_id: 1
    templates:
      - short_code: "greeting_welcome"
        content: "您好！欢迎咨询MegaStore客服，请问有什么可以帮您？"
      - short_code: "greeting_busy"
        content: "您好，当前咨询量较大，请稍等，我会尽快为您解答。"
      - short_code: "shipping_standard"
        content: "我们的标准快递一般3-5个工作日送达，下单后会有物流短信通知您。"
      - short_code: "shipping_express"
        content: "加急快递一般1-2个工作日送达，运费需额外支付15元。"
      - short_code: "shipping_tracking"
        content: "请提供您的订单号，我帮您查询最新的物流信息。"
      - short_code: "return_policy"
        content: "我们支持7天无理由退换货，请在收到商品后7天内联系我们办理。"
      - short_code: "return_process"
        content: "退换货流程：1.联系客服申请 2.寄回商品 3.收到后3个工作日内退款"
      - short_code: "payment_methods"
        content: "我们支持微信支付、支付宝、银行卡等多种支付方式。"
      - short_code: "warranty_policy"
        content: "我们的产品享受一年质保服务，如有质量问题请随时联系我们。"
      - short_code: "contact_info"
        content: "您也可以拨打我们的客服热线400-100-0001，服务时间：周一至周五 9:00-18:00"
      - short_code: "closing_thanks"
        content: "感谢您的咨询！如有其他问题，欢迎随时联系我们。祝您生活愉快！"
      - short_code: "order_confirm"
        content: "您的订单已确认，我们会尽快为您安排发货，请耐心等待。"

  - name: "FreshMart"
    chatwoot_account_id: 2
    templates:
      - short_code: "greeting_welcome"
        content: "您好！欢迎咨询FreshMart生鲜客服，请问有什么可以帮您？"
      - short_code: "greeting_busy"
        content: "您好，当前咨询量较大，请稍等片刻，马上为您服务。"
      - short_code: "shipping_standard"
        content: "生鲜商品我们使用冷链配送，同城当日达，外地次日达。"
      - short_code: "shipping_express"
        content: "加急配送2小时内送达（限同城），需额外支付10元配送费。"
      - short_code: "shipping_tracking"
        content: "请提供您的订单号，我帮您查看配送员的实时位置。"
      - short_code: "return_policy"
        content: "生鲜商品如有质量问题，请在签收后24小时内拍照联系我们，我们会全额退款。"
      - short_code: "return_process"
        content: "退款流程：1.拍照反馈问题 2.客服审核 3.审核通过后24小时内退款到账"
      - short_code: "payment_methods"
        content: "我们支持微信支付、支付宝、银行卡及货到付款。"
      - short_code: "freshness_guarantee"
        content: "我们所有生鲜商品均当日采购，确保新鲜度，如有不满意可申请售后。"
      - short_code: "contact_info"
        content: "您也可以拨打我们的客服热线400-200-0002，服务时间：每天 7:00-22:00"
      - short_code: "closing_thanks"
        content: "感谢您选择FreshMart！期待您的再次光临，祝您用餐愉快！"
      - short_code: "order_confirm"
        content: "您的订单已确认，预计在下单后2小时内送达，请保持手机畅通。"

  - name: "TechZone"
    chatwoot_account_id: 3
    templates:
      - short_code: "greeting_welcome"
        content: "您好！欢迎咨询TechZone数码客服，请问有什么可以帮您？"
      - short_code: "greeting_busy"
        content: "您好，当前咨询人数较多，请您稍候，我们会尽快回复。"
      - short_code: "shipping_standard"
        content: "数码产品均使用顺丰快递，一般2-3个工作日送达。"
      - short_code: "shipping_express"
        content: "加急配送次日达，运费到付，具体费用以快递实际收取为准。"
      - short_code: "shipping_tracking"
        content: "请提供您的订单号，我为您查询物流信息。"
      - short_code: "return_policy"
        content: "数码产品支持15天无理由退换货（未拆封），拆封后如有质量问题享受保修服务。"
      - short_code: "return_process"
        content: "退换货流程：1.联系客服 2.确认问题 3.寄回产品（保留完整包装） 4.检测通过后退款"
      - short_code: "payment_methods"
        content: "支持微信、支付宝、银行卡，大额订单支持分期付款（6/12/24期）。"
      - short_code: "warranty_policy"
        content: "所有数码产品享受官方质保，手机类产品保修1年，配件保修6个月。"
      - short_code: "tech_support"
        content: "如遇产品使用问题，您可以先查阅包装内的快速入门指南，也欢迎联系我们远程协助。"
      - short_code: "contact_info"
        content: "您也可以拨打技术支持热线400-300-0003，服务时间：周一至周日 9:00-21:00"
      - short_code: "closing_thanks"
        content: "感谢您的咨询！如有其他问题，欢迎随时联系TechZone客服。祝您使用愉快！"
