# Job: Create Chatwoot super admin account.
# Run AFTER chatwoot-migrate completes and chatwoot-web is running.
apiVersion: batch/v1
kind: Job
metadata:
  name: chatwoot-admin-init
  namespace: unica-dev
  labels:
    app.kubernetes.io/name: chatwoot
    app.kubernetes.io/component: admin-init
    app.kubernetes.io/part-of: unica
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwoot
        app.kubernetes.io/component: admin-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: admin-init
          image: chatwoot/chatwoot:v3.15.0
          command:
            - /bin/sh
            - -c
            - |
              echo "Creating super admin account..."
              bundle exec rails runner "
                email = ENV['ADMIN_EMAIL']
                password = ENV['ADMIN_PASSWORD']

                # Check if super admin already exists
                if SuperAdmin.find_by(email: email)
                  puts 'Super admin already exists. Skipping.'
                else
                  sup = SuperAdmin.create!(email: email, password: password, password_confirmation: password)
                  puts \"Super admin created: #{sup.email}\"
                end

                # Also create a regular user for Chatwoot platform access
                unless User.find_by(email: email)
                  user = User.new(
                    email: email,
                    password: password,
                    password_confirmation: password,
                    name: 'UNICA Admin',
                    confirmed_at: Time.now
                  )
                  user.save!
                  puts \"User account created: #{user.email}\"
                end
              "
              echo "Admin initialization completed."
          envFrom:
            - configMapRef:
                name: chatwoot-env
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: chatwoot-secrets
                  key: DATABASE_URL
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: chatwoot-secrets
                  key: REDIS_URL
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: chatwoot-secrets
                  key: SECRET_KEY_BASE
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: chatwoot-secrets
                  key: CHATWOOT_ADMIN_EMAIL
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: chatwoot-secrets
                  key: CHATWOOT_ADMIN_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
