# WARNING: This is a template. Replace placeholder values before applying.
# Generate secrets:
#   openssl rand -hex 64    (for SECRET_KEY_BASE)
#   openssl rand -base64 24 (for passwords)
#
apiVersion: v1
kind: Secret
metadata:
  name: chatwoot-secrets
  namespace: unica-dev
  labels:
    app.kubernetes.io/name: chatwoot
    app.kubernetes.io/part-of: unica
type: Opaque
stringData:
  # Chatwoot database credentials
  CHATWOOT_DB_USER: "chatwoot"
  CHATWOOT_DB_PASSWORD: "CHANGE_ME_chatwoot_db_password"
  CHATWOOT_DB_NAME: "chatwoot_db"
  DATABASE_URL: "postgresql://chatwoot:CHANGE_ME_chatwoot_db_password@postgresql.unica-dev.svc.cluster.local:5432/chatwoot_db"

  # Redis (shared instance, use DB index 1 to avoid conflicts)
  REDIS_URL: "redis://:CHANGE_ME_redis_password@redis-master.unica-dev.svc.cluster.local:6379/1"

  # Rails secret key base (generate with: openssl rand -hex 64)
  SECRET_KEY_BASE: "CHANGE_ME_generate_with_openssl_rand_hex_64"

  # Super admin credentials
  CHATWOOT_ADMIN_EMAIL: "admin@unica.local"
  CHATWOOT_ADMIN_PASSWORD: "CHANGE_ME_admin_password"
