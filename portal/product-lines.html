<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>产品线管理 - UNICA 统一管理门户</title>
<style>
  /* Lurus brand tokens — source: shared/lurus-design/tokens.css (light), manual vendor copy */
  :root {
    --lt-paper: #F5F2E8;
    --lt-bg:    #E8E4D6;
    --lt-ink:   #14130F;
    --lt-rule:  #D6D2C2;
    --lt-ok:    #1F7A4F;
    --lt-warn:  #B8821F;
    --lt-err:   #B3392B;
    --lt-info:  #2D4A8A;
    --lt-accent: #FF5D1F;
    /* Accent is theme-invariant, so its foreground is too. Local token, not in upstream tokens.css. */
    --lt-on-accent: #14130F;
    --lt-font-sans: 'Inter Tight', 'Noto Sans SC', "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  :root {
    --bg: var(--lt-paper);
    --surface: var(--lt-bg);
    --text: var(--lt-ink);
    --text-muted: color-mix(in srgb, var(--lt-ink) 62%, transparent);
    --border: var(--lt-rule);
    --primary: var(--lt-accent);
    --primary-hover: color-mix(in srgb, var(--lt-accent) 82%, var(--lt-ink));
    --ok: var(--lt-ok);
    --bad: var(--lt-err);
    --warn: var(--lt-warn);
    --row-hover: color-mix(in srgb, var(--lt-ink) 6%, var(--lt-bg));
    /* Neutral elevation shadow, no brand hue — kept at original value. */
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    /* Lurus brand tokens — source: shared/lurus-design/tokens.css (dark), manual vendor copy */
    :root {
      --lt-paper: #14130F; --lt-bg: #0A0908; --lt-ink: #F0EDE4; --lt-rule: #25221C;
      --lt-ok: #3FA876; --lt-warn: #E0A040; --lt-err: #EE6F5E; --lt-info: #5A7BC7;
      --bg: var(--lt-paper); --surface: var(--lt-bg); --text: var(--lt-ink);
      --text-muted: color-mix(in srgb, var(--lt-ink) 62%, transparent);
      --border: var(--lt-rule); --primary: var(--lt-accent);
      --primary-hover: color-mix(in srgb, var(--lt-accent) 82%, var(--lt-ink));
      --row-hover: color-mix(in srgb, var(--lt-ink) 6%, var(--lt-bg));
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
    }
  }
  /* Lurus brand tokens — source: shared/lurus-design/tokens.css (dark), manual vendor copy */
  :root[data-theme="dark"] {
    --lt-paper: #14130F; --lt-bg: #0A0908; --lt-ink: #F0EDE4; --lt-rule: #25221C;
    --lt-ok: #3FA876; --lt-warn: #E0A040; --lt-err: #EE6F5E; --lt-info: #5A7BC7;
    --bg: var(--lt-paper); --surface: var(--lt-bg); --text: var(--lt-ink);
    --text-muted: color-mix(in srgb, var(--lt-ink) 62%, transparent);
    --border: var(--lt-rule); --primary: var(--lt-accent);
    --primary-hover: color-mix(in srgb, var(--lt-accent) 82%, var(--lt-ink));
    --row-hover: color-mix(in srgb, var(--lt-ink) 6%, var(--lt-bg));
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
  }
  /* Lurus brand tokens — source: shared/lurus-design/tokens.css (light), manual vendor copy */
  :root[data-theme="light"] {
    --lt-paper: #F5F2E8; --lt-bg: #E8E4D6; --lt-ink: #14130F; --lt-rule: #D6D2C2;
    --lt-ok: #1F7A4F; --lt-warn: #B8821F; --lt-err: #B3392B; --lt-info: #2D4A8A;
    --bg: var(--lt-paper); --surface: var(--lt-bg); --text: var(--lt-ink);
    --text-muted: color-mix(in srgb, var(--lt-ink) 62%, transparent);
    --border: var(--lt-rule); --primary: var(--lt-accent);
    --primary-hover: color-mix(in srgb, var(--lt-accent) 82%, var(--lt-ink));
    --row-hover: color-mix(in srgb, var(--lt-ink) 6%, var(--lt-bg));
    --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: var(--lt-font-sans);
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px clamp(16px, 4vw, 48px); display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
  }
  header .left { display: flex; align-items: center; gap: 14px; }
  header a.back { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; }
  header a.back:hover { color: var(--primary); }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  #user-info { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 10px; }
  main {
    flex: 1; padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 48px);
    max-width: 1200px; width: 100%; margin: 0 auto;
  }
  button {
    font-family: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 8px 14px; font-size: 0.85rem;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { border-color: var(--primary); }
  button.primary { background: var(--primary); color: var(--lt-on-accent); border-color: var(--primary); }
  button.primary:hover { background: var(--primary-hover); }
  button.danger:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  label { font-size: 0.85rem; font-weight: 500; display: block; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 0.9rem; font-family: inherit;
  }
  textarea { resize: vertical; min-height: 90px; }
  .field { margin-bottom: 16px; }
  .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }

  /* Login screen */
  #login-view {
    max-width: 380px; margin: 10vh auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px; box-shadow: var(--shadow);
  }
  #login-view h2 { margin: 0 0 6px; font-size: 1.3rem; }
  #login-view p.sub { color: var(--text-muted); margin: 0 0 22px; font-size: 0.88rem; }
  #login-error {
    background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; margin-bottom: 14px; display: none;
  }

  /* App view */
  .flow-hint {
    background: color-mix(in srgb, var(--lt-info) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--lt-info) 30%, transparent);
    border-radius: 12px; padding: 12px 16px; font-size: 0.85rem; margin-bottom: 20px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--text);
  }
  .flow-hint a { color: var(--primary); text-decoration: none; font-weight: 500; }
  .flow-hint a:hover { text-decoration: underline; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; margin-bottom: 20px; }
  .toolbar .spacer { flex: 1; }

  .table-wrap {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow-x: auto; box-shadow: var(--shadow);
  }
  table { width: 100%; border-collapse: collapse; min-width: 880px; }
  th, td { text-align: left; padding: 12px 16px; font-size: 0.88rem; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr:last-child td { border-bottom: none; }
  .pill {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px;
    font-size: 0.78rem; border: 1px solid var(--border);
  }
  .pill.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
  .pill.bad { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
  .pill.muted { color: var(--text-muted); }
  .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .row-actions button { padding: 5px 10px; font-size: 0.78rem; display: inline-flex; align-items: center; gap: 6px; }
  .empty-state { padding: 48px 16px; text-align: center; color: var(--text-muted); }
  .empty-state a { color: var(--primary); text-decoration: none; font-weight: 500; }
  .empty-state a:hover { text-decoration: underline; }

  /* Spinner for pending actions */
  .spinner {
    width: 12px; height: 12px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--text-muted) 40%, transparent);
    border-top-color: var(--primary);
    animation: spin 0.7s linear infinite;
    display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* Modal — the scrim rgba() and the drop-shadow rgba() below are neutral dimming/depth,
     not brand hues, so they keep their original literal values. */
  .modal-backdrop {
    position: fixed; inset: 0; background: rgba(10, 12, 16, 0.45); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 50;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 14px; border: 1px solid var(--border);
    max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 26px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.25);
  }
  .modal h3 { margin: 0 0 4px; font-size: 1.1rem; }
  .modal .modal-sub { color: var(--text-muted); font-size: 0.82rem; margin: 0 0 18px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
  .loading-inline { color: var(--text-muted); font-size: 0.85rem; padding: 8px 0; }

  /* Toasts */
  #toast-host {
    position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column;
    gap: 10px; z-index: 100; max-width: 320px;
  }
  .toast {
    background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--lt-info);
    border-radius: 10px; padding: 12px 16px; font-size: 0.85rem; box-shadow: var(--shadow);
    animation: slide-in 0.2s ease;
  }
  .toast.success { border-left-color: var(--ok); }
  .toast.error { border-left-color: var(--bad); }
  .toast.warn { border-left-color: var(--warn); }
  @keyframes slide-in { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  /* One-click onboarding report */
  .report-steps { margin-top: 4px; }
  .report-step {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .report-step:last-child { border-bottom: none; }
  .report-mark { flex: none; font-size: 0.95rem; line-height: 1.35; }
  .report-mark.ok { color: var(--ok); }
  .report-mark.warn { color: var(--warn); }
  .report-body { min-width: 0; }
  .report-title { font-size: 0.88rem; font-weight: 600; }
  .report-msg { font-size: 0.82rem; color: var(--text-muted); margin-top: 3px; word-break: break-word; }
  .cred-box {
    margin-top: 18px; padding: 14px 16px; border-radius: 12px;
    border: 1px solid color-mix(in srgb, var(--warn) 45%, transparent);
    background: color-mix(in srgb, var(--warn) 10%, transparent);
  }
  .cred-warn { color: var(--warn); font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; }
  .cred-item { margin-bottom: 12px; }
  .cred-item:last-child { margin-bottom: 0; }
  .cred-label { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 5px; }
  .cred-row { display: flex; gap: 8px; }
  .cred-row input { font-family: ui-monospace, SFMono-Regular, Consolas, "Courier New", monospace; }
  .cred-row button { flex: none; }

  .loading-text { color: var(--text-muted); font-size: 0.85rem; padding: 16px; }
  [hidden] { display: none !important; }
</style>

<header>
  <div class="left">
    <a class="back" href="./index.html">← 返回首页</a>
    <h1>产品线管理</h1>
  </div>
  <div id="user-info" hidden>
    <span id="user-email"></span>
    <button id="logout-btn">退出登录</button>
  </div>
</header>

<main>
  <!-- Login view -->
  <section id="login-view">
    <h2>登录</h2>
    <p class="sub">请使用管理账号登录以管理产品线</p>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="primary" id="login-submit" style="width:100%">登 录</button>
    </form>
  </section>

  <!-- App view -->
  <section id="app-view" hidden>
    <div class="flow-hint">
      <span>1 建产品线 → 2 初始化知识库 → 3 去渠道接入挂渠道</span>
      <a href="./channels.html">前往渠道接入 →</a>
    </div>

    <div class="toolbar">
      <div class="spacer"></div>
      <button id="onboard-btn" hidden>⚡ 一键开户</button>
      <button class="primary" id="create-btn">＋ 新建产品线</button>
      <button id="refresh-btn">刷新</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>名称</th>
            <th>显示名</th>
            <th>AI/知识库绑定状态</th>
            <th>创建时间</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="pl-tbody">
          <tr><td colspan="5" class="loading-text">加载中…</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- Create/Edit product line modal -->
<div class="modal-backdrop" id="pl-modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pl-modal-title">
    <h3 id="pl-modal-title">新建产品线</h3>
    <form id="pl-form">
      <div class="field">
        <label for="f-name">名称 (name)</label>
        <input id="f-name" required />
        <div class="hint">用于系统内部标识，建议使用英文/拼音，不含空格</div>
      </div>
      <div class="field">
        <label for="f-display-name">显示名 (display_name)</label>
        <input id="f-display-name" required />
      </div>
      <div class="modal-actions">
        <button type="button" id="pl-modal-cancel">取消</button>
        <button type="submit" class="primary" id="pl-modal-submit">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- AI 参数 modal -->
<div class="modal-backdrop" id="ai-modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="ai-modal-title">
    <h3 id="ai-modal-title">AI 参数</h3>
    <p class="modal-sub" id="ai-modal-sub">加载中…</p>
    <div id="ai-modal-loading" class="loading-inline">正在加载配置…</div>
    <form id="ai-form" hidden>
      <div class="field">
        <label for="f-threshold">置信度阈值 (0 ~ 1)</label>
        <input id="f-threshold" type="number" min="0" max="1" step="0.01" required />
      </div>
      <div class="field">
        <label for="f-handoff">转人工关键词</label>
        <input id="f-handoff" placeholder="以英文逗号分隔，如：转人工,人工客服" />
      </div>
      <div class="field">
        <label for="f-blocked">屏蔽话题（可选）</label>
        <input id="f-blocked" placeholder="以英文逗号分隔" />
      </div>
      <div class="field">
        <label for="f-prompt">系统提示词</label>
        <textarea id="f-prompt"></textarea>
        <div class="hint" id="prompt-hint"></div>
      </div>
      <div class="hint" id="ai-updated-hint"></div>
      <div class="modal-actions">
        <button type="button" id="ai-modal-cancel">取消</button>
        <button type="submit" class="primary" id="ai-modal-submit">保存</button>
      </div>
    </form>
  </div>
</div>

<!-- 一键开户 modal -->
<div class="modal-backdrop" id="onboard-modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="onboard-modal-title">
    <h3 id="onboard-modal-title">一键开户</h3>
    <p class="modal-sub" id="onboard-modal-sub">一次完成产品线、AI 应用与知识库、门户账号和人工客服工作台的开通</p>
    <form id="onboard-form">
      <div class="field">
        <label for="f-cust-name">客户名称 (name)</label>
        <input id="f-cust-name" required />
        <div class="hint">用于系统内部标识，建议使用英文/拼音，不含空格</div>
      </div>
      <div class="field">
        <label for="f-cust-display-name">显示名 (display_name)</label>
        <input id="f-cust-display-name" required />
      </div>
      <div class="field">
        <label for="f-cust-admin-email">管理员邮箱 (admin_email)</label>
        <input id="f-cust-admin-email" type="email" autocomplete="off" required />
        <div class="hint">同时作为门户账号与人工客服工作台账号的登录邮箱</div>
      </div>
      <div class="field">
        <label for="f-cust-admin-password">初始密码 (admin_password)</label>
        <input id="f-cust-admin-password" type="password" autocomplete="new-password" placeholder="留空则自动生成" />
      </div>
      <div class="modal-actions">
        <button type="button" id="onboard-modal-cancel">取消</button>
        <button type="submit" class="primary" id="onboard-modal-submit">开始开户</button>
      </div>
    </form>
    <div id="onboard-result" hidden></div>
  </div>
</div>

<div id="toast-host" aria-live="polite"></div>

<script>
(function () {
  "use strict";

  var TOKEN_KEY = "unica_access_token";
  // Same host as this page, Dify's own port. A literal address here outlives
  // the machine it names — this one pointed at a decommissioned server.
  var DIFY_CONSOLE_BASE = window.location.protocol + "//" + window.location.hostname + ":3402";

  var state = {
    productLines: [], editingId: null, provisioningIds: {}, aiConfigPL: null,
    canManagePL: true, canOnboard: false,
    // onboardDone: the run succeeded, so closing the modal must refresh the list.
    // onboardSecrets: one-time credentials are on screen, so a stray click or
    // Escape must not discard them.
    onboardDone: false, onboardSecrets: false, onboardSummary: ""
  };

  var els = {
    loginView: document.getElementById("login-view"),
    appView: document.getElementById("app-view"),
    loginForm: document.getElementById("login-form"),
    loginError: document.getElementById("login-error"),
    loginSubmit: document.getElementById("login-submit"),
    userInfo: document.getElementById("user-info"),
    userEmail: document.getElementById("user-email"),
    logoutBtn: document.getElementById("logout-btn"),
    createBtn: document.getElementById("create-btn"),
    onboardBtn: document.getElementById("onboard-btn"),
    refreshBtn: document.getElementById("refresh-btn"),
    tbody: document.getElementById("pl-tbody"),

    plModalBackdrop: document.getElementById("pl-modal-backdrop"),
    plModalTitle: document.getElementById("pl-modal-title"),
    plForm: document.getElementById("pl-form"),
    plModalCancel: document.getElementById("pl-modal-cancel"),
    fName: document.getElementById("f-name"),
    fDisplayName: document.getElementById("f-display-name"),

    aiModalBackdrop: document.getElementById("ai-modal-backdrop"),
    aiModalTitle: document.getElementById("ai-modal-title"),
    aiModalSub: document.getElementById("ai-modal-sub"),
    aiModalLoading: document.getElementById("ai-modal-loading"),
    aiForm: document.getElementById("ai-form"),
    aiModalCancel: document.getElementById("ai-modal-cancel"),
    fThreshold: document.getElementById("f-threshold"),
    fHandoff: document.getElementById("f-handoff"),
    fBlocked: document.getElementById("f-blocked"),
    fPrompt: document.getElementById("f-prompt"),
    promptHint: document.getElementById("prompt-hint"),
    aiUpdatedHint: document.getElementById("ai-updated-hint"),

    onboardModalBackdrop: document.getElementById("onboard-modal-backdrop"),
    onboardModalTitle: document.getElementById("onboard-modal-title"),
    onboardModalSub: document.getElementById("onboard-modal-sub"),
    onboardForm: document.getElementById("onboard-form"),
    onboardModalCancel: document.getElementById("onboard-modal-cancel"),
    onboardModalSubmit: document.getElementById("onboard-modal-submit"),
    onboardResult: document.getElementById("onboard-result"),
    fCustName: document.getElementById("f-cust-name"),
    fCustDisplayName: document.getElementById("f-cust-display-name"),
    fCustAdminEmail: document.getElementById("f-cust-admin-email"),
    fCustAdminPassword: document.getElementById("f-cust-admin-password"),

    toastHost: document.getElementById("toast-host")
  };

  var ONBOARD_SUB_TEXT = els.onboardModalSub.textContent;

  // ---------- Toasts ----------
  function toast(message, kind) {
    var el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    el.textContent = message;
    els.toastHost.appendChild(el);
    setTimeout(function () {
      el.style.opacity = "0";
      el.style.transition = "opacity 0.3s";
      setTimeout(function () { el.remove(); }, 300);
    }, 3200);
  }

  // ---------- Auth / API ----------
  function getToken() { return sessionStorage.getItem(TOKEN_KEY); }
  function setToken(t) { sessionStorage.setItem(TOKEN_KEY, t); }
  function clearToken() { sessionStorage.removeItem(TOKEN_KEY); }

  // ---------- Account claims ----------
  // Read-only decode of the access token payload. The server remains the
  // authority on scoping; a token that cannot be decoded yields null so the
  // page keeps its unscoped behaviour instead of failing.
  function decodeClaims(token) {
    if (!token || typeof token !== "string") return null;
    var parts = token.split(".");
    if (parts.length !== 3) return null;
    try {
      var b64 = parts[1].replace(/-/g, "+").replace(/_/g, "/");
      while (b64.length % 4 !== 0) b64 += "=";
      var claims = JSON.parse(atob(b64));
      return claims && typeof claims === "object" ? claims : null;
    } catch (e) {
      return null;
    }
  }

  function isSuperAdmin(claims) {
    if (!claims) return false;
    if (claims.role === "super_admin") return true;
    var roles = claims.roles;
    if (!Array.isArray(roles)) return false;
    for (var i = 0; i < roles.length; i++) {
      if (roles[i] === "super_admin") return true;
    }
    return false;
  }

  // manage_product_lines is a super-admin permission on the server, and every
  // mutation on this page needs it. Undecodable token -> keep the full UI.
  function canManageProductLines() {
    var claims = decodeClaims(getToken());
    if (!claims) return true;
    return isSuperAdmin(claims);
  }

  // Mirrors the server permission matrix: the onboarding route chains
  // manage_users and manage_product_lines, and super_admin is the only role
  // granted both. Strict === true keeps inherited keys out.
  var ONBOARD_CUSTOMER_ROLES = { super_admin: true };

  function claimRoles(claims) {
    var roles = [];
    if (!claims) return roles;
    if (typeof claims.role === "string" && claims.role) roles.push(claims.role);
    if (Array.isArray(claims.roles)) {
      for (var i = 0; i < claims.roles.length; i++) {
        if (typeof claims.roles[i] === "string") roles.push(claims.roles[i]);
      }
    }
    return roles;
  }

  // Onboarding is the one action here that is hidden rather than shown by
  // default: it provisions across four systems, so an account that cannot be
  // shown to hold both permissions must not be offered the button.
  function canOnboardCustomers() {
    var roles = claimRoles(decodeClaims(getToken()));
    for (var i = 0; i < roles.length; i++) {
      if (ONBOARD_CUSTOMER_ROLES[roles[i]] === true) return true;
    }
    return false;
  }

  function applyAccountVisibility() {
    state.canManagePL = canManageProductLines();
    state.canOnboard = canOnboardCustomers();
    els.createBtn.hidden = !state.canManagePL;
    els.onboardBtn.hidden = !state.canOnboard;
  }

  function showLogin(message) {
    clearToken();
    els.appView.hidden = true;
    els.userInfo.hidden = true;
    els.loginView.hidden = false;
    if (message) {
      els.loginError.textContent = message;
      els.loginError.style.display = "block";
    }
  }

  function showApp() {
    els.loginView.hidden = true;
    els.appView.hidden = false;
    els.userInfo.hidden = false;
  }

  // Wraps fetch with Authorization header, JSON parsing, and 401 handling.
  function api(path, options) {
    options = options || {};
    var headers = Object.assign({}, options.headers || {});
    var token = getToken();
    if (token) headers["Authorization"] = "Bearer " + token;
    if (options.body && !headers["Content-Type"]) headers["Content-Type"] = "application/json";

    return fetch(path, Object.assign({}, options, { headers: headers }))
      .then(function (res) {
        if (res.status === 401) {
          showLogin("登录已过期，请重新登录");
          throw new Error("unauthorized");
        }
        return res.text().then(function (text) {
          var data = null;
          if (text) {
            try { data = JSON.parse(text); } catch (e) { /* non-JSON response */ }
          }
          if (!res.ok) {
            var msg = (data && (data.error || data.message)) || ("请求失败 (" + res.status + ")");
            var err = new Error(msg);
            err.status = res.status;
            throw err;
          }
          return data;
        });
      });
  }

  // ---------- Login ----------
  els.loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    els.loginError.style.display = "none";
    els.loginSubmit.disabled = true;
    els.loginSubmit.textContent = "登录中…";

    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    fetch("/api/v1/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ email: email, password: password })
    })
      .then(function (res) {
        return res.text().then(function (text) {
          var data = null;
          try { data = text ? JSON.parse(text) : null; } catch (e) {}
          if (!res.ok) {
            var msg = (data && data.error) || "邮箱或密码错误";
            throw new Error(msg);
          }
          return data;
        });
      })
      .then(function (data) {
        if (!data || !data.access_token) throw new Error("登录响应异常");
        setToken(data.access_token);
        els.userEmail.textContent = email;
        showApp();
        bootstrap();
      })
      .catch(function (err) {
        els.loginError.textContent = err.message || "登录失败，请检查网络";
        els.loginError.style.display = "block";
      })
      .finally(function () {
        els.loginSubmit.disabled = false;
        els.loginSubmit.textContent = "登 录";
      });
  });

  els.logoutBtn.addEventListener("click", function () {
    showLogin();
  });

  // ---------- Bootstrap after login ----------
  function bootstrap() {
    applyAccountVisibility();
    loadProductLines();
  }

  els.refreshBtn.addEventListener("click", loadProductLines);

  // ---------- Product line list ----------
  function loadProductLines() {
    els.tbody.innerHTML = '<tr><td colspan="5" class="loading-text">加载中…</td></tr>';
    return api("/api/v1/product-lines")
      .then(function (data) {
        state.productLines = Array.isArray(data) ? data : [];
        renderProductLines();
      })
      .catch(function (err) {
        if (err.message === "unauthorized") return;
        els.tbody.innerHTML = '<tr><td colspan="5" class="empty-state">加载失败: ' + escapeHtml(err.message) + "</td></tr>";
        toast("加载产品线失败: " + err.message, "error");
      });
  }

  function renderProductLines() {
    // Without manage_product_lines the server refuses every mutation here, so
    // the account gets a read-only view rather than buttons that would 403.
    applyAccountVisibility();
    if (state.productLines.length === 0) {
      els.tbody.innerHTML = '<tr><td colspan="5" class="empty-state">' +
        (state.canManagePL ? "暂无产品线，点击“新建产品线”开始" : "暂无产品线") +
        "</td></tr>";
      return;
    }
    els.tbody.innerHTML = state.productLines.map(rowHtml).join("");

    state.productLines.forEach(function (pl) {
      var editBtn = document.getElementById("edit-" + pl.id);
      var delBtn = document.getElementById("del-" + pl.id);
      var provisionBtn = document.getElementById("provision-" + pl.id);
      var openKbBtn = document.getElementById("openkb-" + pl.id);
      var aiConfigBtn = document.getElementById("aicfg-" + pl.id);
      if (editBtn) editBtn.addEventListener("click", function () { openEditModal(pl); });
      if (delBtn) delBtn.addEventListener("click", function () { deleteProductLine(pl); });
      if (provisionBtn) provisionBtn.addEventListener("click", function () { provisionDify(pl, provisionBtn); });
      if (openKbBtn) openKbBtn.addEventListener("click", function () { openKnowledgeBase(pl); });
      if (aiConfigBtn) aiConfigBtn.addEventListener("click", function () { openAIConfigModal(pl); });
    });
  }

  function isBound(pl) {
    return !!(pl.has_dify_binding || pl.dify_dataset_id || pl.dify_agent_id);
  }

  function rowHtml(pl) {
    var bound = isBound(pl);
    var bindPill = bound
      ? '<span class="pill ok">已挂载</span>'
      : '<span class="pill muted">未挂载</span>';
    var pending = !!state.provisioningIds[pl.id];
    // Edit / delete / provision all require manage_product_lines; AI 参数 and the
    // knowledge-base link do not, so a scoped account keeps those.
    var canManage = state.canManagePL;
    var provisionBtnHtml = canManage
      ? '<button id="provision-' + pl.id + '"' + (pending ? " disabled" : "") + '>' +
        (pending ? '<span class="spinner"></span>初始化中…' : "初始化 AI 与知识库") + "</button>"
      : "";
    var openKbBtnHtml = pl.dify_dataset_id
      ? '<button id="openkb-' + pl.id + '">打开知识库</button>'
      : "";
    return (
      "<tr>" +
      "<td>" + escapeHtml(pl.name) + "</td>" +
      "<td>" + escapeHtml(pl.display_name) + "</td>" +
      "<td>" + bindPill + "</td>" +
      "<td>" + formatDate(pl.created_at) + "</td>" +
      '<td><div class="row-actions">' +
      (canManage ? '<button id="edit-' + pl.id + '">编辑</button>' : "") +
      '<button id="aicfg-' + pl.id + '">AI 参数</button>' +
      provisionBtnHtml +
      openKbBtnHtml +
      (canManage ? '<button class="danger" id="del-' + pl.id + '">删除</button>' : "") +
      "</div></td>" +
      "</tr>"
    );
  }

  function formatDate(iso) {
    if (!iso) return "—";
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString("zh-CN", { hour12: false });
    } catch (e) {
      return iso;
    }
  }

  // ---------- Delete ----------
  function deleteProductLine(pl) {
    if (!confirm('确认删除产品线 "' + pl.display_name + '" 吗？此操作不可撤销。')) return;
    api("/api/v1/product-lines/" + pl.id, { method: "DELETE" })
      .then(function () {
        toast("产品线已删除", "success");
        loadProductLines();
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") toast("删除失败: " + err.message, "error");
      });
  }

  // ---------- Provision Dify (AI + knowledge base) ----------
  function provisionDify(pl, btn) {
    state.provisioningIds[pl.id] = true;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>初始化中…';

    api("/api/v1/product-lines/" + pl.id + "/provision-dify", { method: "POST" })
      .then(function (data) {
        if (data && data.provisioned === false) {
          toast("该产品线已存在绑定", "warn");
        } else {
          toast("AI 与知识库初始化成功", "success");
        }
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") toast("初始化失败: " + err.message, "error");
      })
      .finally(function () {
        delete state.provisioningIds[pl.id];
        loadProductLines();
      });
  }

  // ---------- Open knowledge base ----------
  function openKnowledgeBase(pl) {
    if (!pl.dify_dataset_id) return;
    var url = DIFY_CONSOLE_BASE + "/datasets/" + encodeURIComponent(pl.dify_dataset_id) + "/documents";
    window.open(url, "_blank", "noopener");
  }

    if (els.plModalBackdrop.classList.contains("open")) closePLModal();
    if (els.aiModalBackdrop.classList.contains("open")) closeAIModal();
    // Escape is ignored while one-time credentials are displayed; the report
    // carries an explicit 关闭 button for that case.

  });

    state.editingId = null;

  els.plForm.addEventListener("submit", function (e) {

  // ---------- AI 参数 modal ----------
  els.aiModalCancel.addEventListener("click", closeAIModal);
  els.aiModalBackdrop.addEventListener("click", function (e) {
    if (e.target === els.aiModalBackdrop) closeAIModal();
  });

  function openAIConfigModal(pl) {
    state.aiConfigPL = pl;
    els.aiModalTitle.textContent = "AI 参数 - " + (pl.display_name || pl.name);
    els.aiModalSub.textContent = "";
    els.aiForm.hidden = true;
    els.aiModalLoading.hidden = false;
    els.aiModalLoading.textContent = "正在加载配置…";
    els.aiModalBackdrop.classList.add("open");

    api("/api/v1/ai-config/" + pl.id)
      .then(function (cfg) {
        els.aiModalSub.textContent = cfg.product_line_name || "";
        els.fThreshold.value = cfg.confidence_threshold != null ? cfg.confidence_threshold : 0.7;
        els.fHandoff.value = (cfg.handoff_keywords || []).join(",");
        els.fBlocked.value = (cfg.blocked_topics || []).join(",");
        els.fPrompt.value = cfg.system_prompt || "";

        var hasAgent = !!pl.dify_agent_id;
        els.fPrompt.disabled = !hasAgent;
        els.promptHint.textContent = hasAgent
          ? "保存后将直接更新 Dify 中的系统提示词"
          : "未配置 Dify 应用，暂无法编辑系统提示词";

        var updatedHint = [];
        if (cfg.updated_at) updatedHint.push("最近更新: " + formatDate(cfg.updated_at));
        if (cfg.updated_by) updatedHint.push("更新人: " + cfg.updated_by);
        els.aiUpdatedHint.textContent = updatedHint.join(" · ");

        els.aiModalLoading.hidden = true;
        els.aiForm.hidden = false;
      })
      .catch(function (err) {
        if (err.message === "unauthorized") return;
        if (err.status === 404) {
          els.aiModalLoading.hidden = true;
          els.aiModalSub.textContent = "尚无 AI 配置记录，保存后将创建默认配置";
          els.fThreshold.value = 0.7;
          els.fHandoff.value = "转人工,人工客服";
          els.fBlocked.value = "";
          els.fPrompt.value = "";
          els.fPrompt.disabled = !pl.dify_agent_id;
          els.promptHint.textContent = pl.dify_agent_id
            ? "保存后将直接更新 Dify 中的系统提示词"
            : "未配置 Dify 应用，暂无法编辑系统提示词";
          els.aiUpdatedHint.textContent = "";
          els.aiForm.hidden = false;
          return;
        }
        els.aiModalLoading.textContent = "加载失败: " + err.message;
        toast("加载 AI 配置失败: " + err.message, "error");
      });
  }

  function closeAIModal() {
    els.aiModalBackdrop.classList.remove("open");
    state.aiConfigPL = null;
    els.aiForm.reset();
  }

  els.aiForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var pl = state.aiConfigPL;
    if (!pl) return;

    var threshold = parseFloat(els.fThreshold.value);
    if (isNaN(threshold) || threshold < 0 || threshold > 1) {
      toast("置信度阈值须为 0 至 1 之间的数字", "error");
      return;
    }
    var handoffKeywords = splitCsv(els.fHandoff.value);
    var blockedTopics = splitCsv(els.fBlocked.value);
    var promptChanged = !els.fPrompt.disabled;

    var submitBtn = document.getElementById("ai-modal-submit");
    submitBtn.disabled = true;
    submitBtn.textContent = "保存中…";

    var rulesRequest = api("/api/v1/ai-config/" + pl.id + "/handoff-rules", {
      method: "PUT",
      body: JSON.stringify({
        handoff_keywords: handoffKeywords,
        blocked_topics: blockedTopics,
        threshold: threshold
      })
    });

    rulesRequest
      .then(function () {
        if (promptChanged) {
          return api("/api/v1/ai-config/" + pl.id + "/prompt", {
            method: "PUT",
            body: JSON.stringify({ prompt: els.fPrompt.value })
          });
        }
      })
      .then(function () {
        toast("AI 参数已保存", "success");
        closeAIModal();
      })
      .catch(function (err) {
        if (err.message !== "unauthorized") toast("保存失败: " + err.message, "error");
      })
      .finally(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = "保存";
      });
  });

  function splitCsv(str) {
    return String(str || "")
      .split(",")
      .map(function (s) { return s.trim(); })
      .filter(function (s) { return s.length > 0; });
  }

  // Step rows are derived once and feed both the on-screen report and the
  // plain-text summary, so the two can never drift apart.
  function onboardSteps(data) {
    var pl = data.product_line || {};
    var dify = data.dify || {};
    var portal = data.portal_account || {};
    var chatwoot = data.chatwoot || {};
    var steps = [];

    var plLabel = (pl.display_name || "") + "（" + (pl.name || "") + "）";
    steps.push({
      title: "产品线",
      ok: true,
      message: (pl.created ? "已创建：" : "已存在，直接复用：") + plLabel
    });

    var difyIds = [];
    if (dify.dify_agent_id) difyIds.push("应用 " + dify.dify_agent_id);
    if (dify.dataset_id) difyIds.push("知识库 " + dify.dataset_id);
    var difySuffix = difyIds.length ? "（" + difyIds.join(" / ") + "）" : "";
    // A message is present only when the step degraded; a clean run with
    // provisioned=false simply means the binding was already there.
    if (dify.message) {
      steps.push({ title: "AI 应用与知识库", ok: false, message: "未完成：" + dify.message });
    } else if (dify.provisioned) {
      steps.push({ title: "AI 应用与知识库", ok: true, message: "已创建并绑定" + difySuffix });
    } else {
      steps.push({ title: "AI 应用与知识库", ok: true, message: "已存在绑定，未重复创建" + difySuffix });
    }

    steps.push({
      title: "门户账号",
      ok: true,
      message: (portal.created ? "已创建：" : "账号已存在，已确保授权：") +
        (portal.email || "") + "，角色 " + (portal.role || "")
    });

    var cwDetails = [];
    if (chatwoot.account_id) cwDetails.push("账户 ID " + chatwoot.account_id);
    if (chatwoot.inbox_id) cwDetails.push("收件箱 ID " + chatwoot.inbox_id);
    var cwSuffix = cwDetails.length ? "：" + cwDetails.join("，") : "";
    // configured=true with a reason is the graceful path: the tenant exists but
    // one part of it still needs a human.
    if (chatwoot.configured && !chatwoot.reason) {
      steps.push({ title: "人工客服工作台", ok: true, message: "已开通" + cwSuffix });
    } else if (chatwoot.configured) {
      steps.push({ title: "人工客服工作台", ok: false, message: "部分完成" + cwSuffix + "。" + chatwoot.reason });
    } else {
      steps.push({ title: "人工客服工作台", ok: false, message: "未完成：" + (chatwoot.reason || "服务端未返回原因") });
    }

    return steps;
  }

  // Generated passwords appear in this response and nowhere else, ever.
  function onboardCredentials(data) {
    var portal = data.portal_account || {};
    var chatwoot = data.chatwoot || {};
    var creds = [];
    if (portal.generated_password) {
      creds.push({
        label: "门户账号密码（" + (portal.email || "") + "）",
        value: portal.generated_password
      });
    }
    if (chatwoot.generated_password) {
      creds.push({
        label: "人工客服工作台密码（" + (chatwoot.agent_email || portal.email || "") + "）",
        value: chatwoot.generated_password
      });
    }
    return creds;
  }

  function renderOnboardResult(data) {
    var pl = data.product_line || {};
    var steps = onboardSteps(data);
    var creds = onboardCredentials(data);
    var allOk = true;
    for (var i = 0; i < steps.length; i++) {
      if (!steps[i].ok) allOk = false;
    }

    state.onboardSecrets = creds.length > 0;
    state.onboardSummary = buildOnboardSummary(data, steps, creds);

    els.onboardModalTitle.textContent = allOk ? "开户完成" : "开户完成（部分步骤需人工处理）";
    els.onboardModalSub.textContent = "客户 " + (pl.display_name || pl.name || "") +
      " · 产品线 ID " + (data.product_line_id || data.id || "");

    var html = '<div class="report-steps">' + steps.map(function (s) {
      return '<div class="report-step">' +
        '<span class="report-mark ' + (s.ok ? "ok" : "warn") + '">' + (s.ok ? "✓" : "⚠") + "</span>" +
        '<div class="report-body">' +
        '<div class="report-title">' + escapeHtml(s.title) + "</div>" +
        '<div class="report-msg">' + escapeHtml(s.message) + "</div>" +
        "</div>" +
        "</div>";
    }).join("") + "</div>";

    if (creds.length > 0) {
      html += '<div class="cred-box">' +
        '<div class="cred-warn">⚠ 仅此一次显示，请立即保存</div>' +
        creds.map(function (c, idx) {
          return '<div class="cred-item">' +
            '<div class="cred-label">' + escapeHtml(c.label) + "</div>" +
            '<div class="cred-row">' +
            '<input id="onboard-cred-' + idx + '" readonly value="' + escapeAttr(c.value) + '" />' +
            '<button type="button" id="onboard-cred-copy-' + idx + '">复制</button>' +
            "</div>" +
            "</div>";
        }).join("") +
        "</div>";
    }

    html += '<div class="modal-actions">' +
      '<button type="button" id="onboard-copy-all">复制全部</button>' +
      '<button type="button" class="primary" id="onboard-close">关闭</button>' +
      "</div>";

    els.onboardForm.hidden = true;
    els.onboardResult.innerHTML = html;
    els.onboardResult.hidden = false;

    creds.forEach(function (c, idx) {
      var copyBtn = document.getElementById("onboard-cred-copy-" + idx);
      if (copyBtn) {
        copyBtn.addEventListener("click", function () { copyText(c.value, "密码已复制"); });
      }
    });
    var copyAllBtn = document.getElementById("onboard-copy-all");
    if (copyAllBtn) {
      copyAllBtn.addEventListener("click", function () { copyText(state.onboardSummary, "开户结果已复制"); });
    }
    var closeBtn = document.getElementById("onboard-close");
    if (closeBtn) {
      closeBtn.addEventListener("click", closeOnboardModal);
      closeBtn.focus();
    }

    toast(allOk ? "开户完成" : "开户完成，部分步骤需人工处理", allOk ? "success" : "warn");
  }

  // Plain text, not HTML: this is what lands on the clipboard.
  function buildOnboardSummary(data, steps, creds) {
    var pl = data.product_line || {};
    var lines = [];
    lines.push("UNICA 一键开户结果");
    lines.push("客户: " + (pl.display_name || "") + " (" + (pl.name || "") + ")");
    lines.push("产品线 ID: " + (data.product_line_id || data.id || ""));
    lines.push("");
    steps.forEach(function (s) {
      lines.push((s.ok ? "[OK] " : "[!] ") + s.title + ": " + s.message);
    });
    if (creds.length > 0) {
      lines.push("");
      lines.push("凭据（仅此一次显示，请立即保存）:");
      creds.forEach(function (c) {
        lines.push("  " + c.label + ": " + c.value);
      });
    }
    return lines.join("\n");
  }

  // ---------- Clipboard ----------
  // Falls back to a temporary textarea because the portal is often served over
  // plain HTTP, where the async clipboard API is unavailable.
  function copyText(text, okMessage) {
    if (!text) return;
    if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(function () { toast(okMessage, "success"); })
        .catch(function () { legacyCopy(text, okMessage); });
      return;
    }
    legacyCopy(text, okMessage);
  }

  function legacyCopy(text, okMessage) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    toast(ok ? okMessage : "复制失败，请手动选择", ok ? "success" : "warn");
  }

  // ---------- Utils ----------
  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function escapeAttr(str) { return escapeHtml(str); }

  // ---------- Init ----------
  if (getToken()) {
    showApp();
    bootstrap();
  } else {
    showLogin();
  }
})();
</script>
