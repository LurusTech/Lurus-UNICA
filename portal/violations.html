<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>质量复核 - UNICA 统一管理门户</title>
<link rel="stylesheet" href="./ui/unica-ui.css?v=1">
<style>
  /* Brand tokens, toasts, chips and pills come from ui/unica-ui.css. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 16px clamp(16px, 4vw, 48px); display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
  }
  header .left { display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 1.1rem; margin: 0; font-weight: 600; }
  #user-info { font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 10px; }
  main {
    flex: 1; padding: clamp(20px, 4vw, 40px) clamp(16px, 4vw, 48px);
    max-width: 1200px; width: 100%; margin: 0 auto;
  }
  button {
    font-family: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 8px 14px; font-size: 0.85rem;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { border-color: var(--primary); }
  button.primary { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.primary:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  input:disabled, select:disabled { opacity: 0.55; cursor: not-allowed; }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  label { font-size: 0.85rem; font-weight: 500; display: block; margin-bottom: 6px; }
  input, select {
    width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 0.9rem; font-family: inherit;
  }
  input[type="checkbox"] { width: auto; padding: 0; }
  .field { margin-bottom: 16px; }
  .hint { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; line-height: 1.6; }

  /* Login screen */
  #login-view {
    max-width: 380px; margin: 10vh auto; background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px; box-shadow: var(--shadow);
  }
  #login-view h2 { margin: 0 0 6px; font-size: 1.3rem; }
  #login-view p.sub { color: var(--text-muted); margin: 0 0 22px; font-size: 0.88rem; }
  #login-error {
    background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; margin-bottom: 14px; display: none;
  }
  #login-view .remember { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  #login-view .remember input { width: auto; }
  #login-view .remember label { margin-bottom: 0; font-weight: 400; color: var(--text-muted); }

  /* App view */
  .toolbar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: flex-end; margin-bottom: 20px; }
  .toolbar .field { margin-bottom: 0; min-width: 220px; }
  .toolbar .field.narrow { min-width: 0; }
  .toolbar .spacer { flex: 1; }

  .switch-row { display: flex; align-items: center; gap: 8px; height: 38px; }
  .switch-row label { margin-bottom: 0; white-space: nowrap; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 22px 24px; box-shadow: var(--shadow); margin-bottom: 20px;
  }
  .card-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 4px;
  }
  .card h2 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  .card-sub { color: var(--text-muted); font-size: 0.82rem; margin: 0 0 18px; line-height: 1.6; }

  code {
    font-family: ui-monospace, SFMono-Regular, Consolas, "Cascadia Mono", "Courier New", monospace;
    font-size: 0.85em; background: var(--bg); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 5px;
  }

  .table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 1020px; }
  th, td { text-align: left; padding: 11px 12px; font-size: 0.88rem; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: top; }
  th { color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
  tbody tr:last-child td { border-bottom: none; }
  tr.v-row { cursor: pointer; }
  tr.v-row:hover { background: var(--row-hover); }
  tr.v-row.expanded { background: var(--row-hover); }
  td.msg { white-space: normal; min-width: 180px; max-width: 420px; line-height: 1.6; }
  /* Property names are snake_case and break badly; clip them and keep the full
     value in the title attribute and the detail panel. */
  td.prop { max-width: 140px; }
  td.prop code {
    display: inline-block; max-width: 100%; overflow: hidden;
    text-overflow: ellipsis; vertical-align: bottom; white-space: nowrap;
  }
  /* The action set must stay on one line; the summary column absorbs the width. */
  td.actions-cell { cursor: default; width: 1%; }

  .row-actions { display: flex; gap: 6px; flex-wrap: nowrap; }
  .row-actions button { padding: 5px 9px; font-size: 0.78rem; white-space: nowrap; }

  /* Quality overview: three north-star numbers, each with its own sample
     size right next to it -- never just a percentage on its own. */
  .northstar-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .northstar-metric {
    border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; background: var(--bg);
  }
  .northstar-metric .metric-label {
    font-size: 0.78rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em;
    margin-bottom: 6px;
  }
  .northstar-metric .metric-value { font-size: 1.5rem; font-weight: 600; line-height: 1.3; }
  .northstar-metric .metric-value.muted { color: var(--text-muted); font-size: 1.1rem; font-weight: 500; }
  .northstar-metric .metric-sample { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; line-height: 1.6; }
  .northstar-metric.stale .metric-value { color: var(--warn); }

  /* Detail panel */
  tr.detail-row > td { padding: 0; background: var(--bg); white-space: normal; }
  .detail { padding: 16px 18px; }
  .detail-cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
  .detail-col {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; border-left-width: 3px;
  }
  .detail-col.got { border-left-color: var(--bad); }
  .detail-col.want { border-left-color: var(--ok); }
  .detail-col h4 {
    margin: 0 0 6px; font-size: 0.75rem; font-weight: 600; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .detail-val { font-size: 0.88rem; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .detail-val.empty { color: var(--text-muted); }
  .evidence {
    margin-top: 14px; font-size: 0.86rem; line-height: 1.7;
    border-left: 3px solid var(--border); padding-left: 12px;
  }
  .evidence .lead { color: var(--text-muted); font-size: 0.78rem; display: block; margin-bottom: 2px; }
  .evidence q { quotes: "\201C" "\201D"; }
  .detail-meta {
    margin-top: 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
    font-size: 0.8rem; color: var(--text-muted);
  }
  .detail-meta .copy-btn { padding: 3px 9px; font-size: 0.75rem; margin-left: 6px; }

  .pager {
    display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin-top: 14px;
  }
  .pager .count { margin-right: auto; font-size: 0.82rem; color: var(--text-muted); }

  .empty-state { padding: 40px 16px; text-align: center; color: var(--text-muted); line-height: 1.8; }
  .empty-state a { color: var(--primary); text-decoration: none; font-weight: 500; }
  .empty-state a:hover { text-decoration: underline; }
  .empty-state .big { display: block; font-size: 1.6rem; margin-bottom: 8px; }
  .empty-state .title { color: var(--text); font-weight: 600; font-size: 0.95rem; }
  .empty-state.celebrate .title { color: var(--ok); }
  .empty-state .actions-row { margin-top: 14px; display: flex; justify-content: center; gap: 10px; }

  /* A row opened from a link (?focus=<id>): marked until the page is left,
     with an outline as well as the tint so it does not rely on colour. */
  tr.v-row.focused { background: var(--row-hover); outline: 2px solid var(--primary); outline-offset: -2px; }
  tr.v-row:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }

  .loading-text { color: var(--text-muted); font-size: 0.85rem; padding: 16px; }
  [hidden] { display: none !important; }
</style>

<header>
  <div class="left">
    <h1>质量复核</h1>
  </div>
  <div id="user-info" hidden>
    <span id="user-email"></span>
    <button id="logout-btn">退出登录</button>
  </div>
</header>

<main>
  <!-- Login view -->
  <section id="login-view">
    <h2>登录</h2>
    <p class="sub">请使用管理账号登录以复核 AI 回答违规证据</p>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="remember">
        <input id="remember" type="checkbox" />
        <label for="remember">记住我（7 天内免登录）</label>
      </div>
      <button type="submit" class="primary" id="login-submit" style="width:100%">登 录</button>
    </form>
  </section>

  <!-- App view -->
  <section id="app-view" hidden>
    <div class="toolbar">
      <div class="field" id="pl-field" hidden>
        <label for="pl-select">租户</label>
        <select id="pl-select"><option value="">请选择租户</option></select>
      </div>
      <div class="field narrow">
        <label id="status-label">状态</label>
        <div class="uu-chips" id="status-chips" role="group" aria-labelledby="status-label">
          <button type="button" class="uu-chip" data-status="pending" aria-pressed="true">待复核</button>
          <button type="button" class="uu-chip" data-status="" aria-pressed="false">全部</button>
          <button type="button" class="uu-chip" data-status="ontology_wrong" aria-pressed="false">本体错了</button>
          <button type="button" class="uu-chip" data-status="model_wrong" aria-pressed="false">模型错了</button>
          <button type="button" class="uu-chip" data-status="false_positive" aria-pressed="false">误报</button>
        </div>
      </div>
      <div class="field">
        <label for="kind-select">违规类型</label>
        <select id="kind-select"><option value="">全部</option></select>
      </div>
      <div class="field narrow">
        <div class="switch-row">
          <input type="checkbox" id="enforced-only" />
          <label for="enforced-only">仅拦截</label>
        </div>
      </div>
      <div class="spacer"></div>
      <button id="refresh-btn">刷新</button>
    </div>

    <div class="card empty-state" id="no-pl-hint">请先在上方选择一个租户</div>

    <div class="card" id="northstar-card" hidden>
      <div class="card-head">
        <h2>质量概览</h2>
        <span class="uu-pill muted" id="northstar-window-pill">—</span>
      </div>
      <p class="card-sub">
        三个互相制衡的北极星指标（见 doc/metrics-northstar.md）：自助解决率守价值，
        合规误报率守信任，事实过期守真实。样本不足时明确标注，不给出一个假装精确的数字。
      </p>
      <div class="northstar-grid" id="northstar-grid">
        <div class="loading-text">加载中…</div>
      </div>
    </div>

    <div class="card" id="queue-card" hidden>
      <div class="card-head">
        <h2>复核队列</h2>
        <span class="uu-pill muted" id="total-pill">—</span>
      </div>
      <p class="card-sub">
        每一条都是 AI 回答与本体冲突的证据。判定「本体错了」说明本体写漏或写错，
        应回到领域本体修正并重新发布；「模型错了」进入回答质量问题；「误报」说明校验规则本身过严。
      </p>

      <div class="table-wrap" id="table-wrap">
        <table>
          <thead>
            <tr>
              <th>发生时间</th>
              <th>违规类型</th>
              <th>属性</th>
              <th>摘要</th>
              <th>模式</th>
              <th>复核状态</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="v-tbody">
            <tr><td colspan="7" class="loading-text">加载中…</td></tr>
          </tbody>
        </table>
      </div>

      <div class="empty-state" id="empty-box" hidden></div>

      <div class="pager" id="pager" hidden>
        <span class="count" id="page-count"></span>
        <button id="prev-btn">上一页</button>
        <button id="next-btn">下一页</button>
      </div>
    </div>
  </section>
</main>


<script src="./auth.js?v=1"></script>
<script src="./ui/unica-ui.js?v=1"></script>
<script>
(function () {
  "use strict";

  var PAGE_SIZE = 50;

  // Violation kinds are a stable server-side interface; this map only supplies
  // the operator-facing wording. Unknown kinds fall back to the raw value.
  var KIND_LABELS = {
    undeclared_property: "未声明属性",
    unknown_scope: "未知场景",
    domain_mismatch: "类型不适用",
    range: "取值越界",
    contradicts_assertion: "与断言冲突",
    functional_conflict: "单值冲突",
    ambiguous_scope: "场景未限定",
    missing_companion: "缺少配套事实",
    denied_capability: "声称不提供的能力",
    unbacked_commitment: "承诺或金额无出处",
    deferred_figure: "应由人工核定的数字",
    redline_phrase: "红线表述（扣下）",
    redline_flagged: "红线表述（仅记录）",
    ungrounded_figure: "数字无出处"
  };

  var STATUS_LABELS = {
    pending: "待复核",
    ontology_wrong: "本体错了",
    model_wrong: "模型错了",
    false_positive: "误报"
  };

  var STATUS_PILLS = {
    pending: "warn",
    ontology_wrong: "info",
    model_wrong: "bad",
    false_positive: "muted"
  };

  var state = {
    tenants: [],
    currentTenant: null,
    status: "pending",
    kind: "",
    enforcedOnly: false,
    offset: 0,
    total: 0,
    items: [],
    knownKinds: [],
    expanded: {},
    loading: false,
    // ?focus=<id>: the row to open on; focusPending until it has been looked for.
    focusId: "",
    focusPending: false
  };

  var els = {
    loginView: document.getElementById("login-view"),
    appView: document.getElementById("app-view"),
    loginForm: document.getElementById("login-form"),
    loginError: document.getElementById("login-error"),
    loginSubmit: document.getElementById("login-submit"),
    remember: document.getElementById("remember"),
    userInfo: document.getElementById("user-info"),
    userEmail: document.getElementById("user-email"),
    logoutBtn: document.getElementById("logout-btn"),

    plField: document.getElementById("pl-field"),
    plSelect: document.getElementById("pl-select"),
    statusChips: document.getElementById("status-chips"),
    kindSelect: document.getElementById("kind-select"),
    enforcedOnly: document.getElementById("enforced-only"),
    refreshBtn: document.getElementById("refresh-btn"),

    noPlHint: document.getElementById("no-pl-hint"),
    northstarCard: document.getElementById("northstar-card"),
    northstarWindowPill: document.getElementById("northstar-window-pill"),
    northstarGrid: document.getElementById("northstar-grid"),
    queueCard: document.getElementById("queue-card"),
    totalPill: document.getElementById("total-pill"),
    tableWrap: document.getElementById("table-wrap"),
    tbody: document.getElementById("v-tbody"),
    emptyBox: document.getElementById("empty-box"),
    pager: document.getElementById("pager"),
    pageCount: document.getElementById("page-count"),
    prevBtn: document.getElementById("prev-btn"),
    nextBtn: document.getElementById("next-btn")
  };

  // ---------- Shared interface ----------
  // Toasts take an optional {href, text} link and stay longer when they carry
  // one; the shared layer keeps that signature.
  var toast = UnicaUI.toast;
  var announce = UnicaUI.liveRegion.announce;

  // Firewall and redline findings are not claims about the ontology, so
  // "本体错了" is never a verdict for them. Mirrors firewallKinds in
  // pkg/domain/commitment.go.
  var FIREWALL_KINDS = ["unbacked_commitment", "deferred_figure", "redline_phrase", "redline_flagged", "ungrounded_figure"];

  function isFirewallKind(kind) { return FIREWALL_KINDS.indexOf(kind) !== -1; }

  // ?focus=<violation id> opens the queue on one row, the target of event
  // links. There is no single-violation read endpoint, so the row is looked
  // for in the list, newest first, up to FOCUS_SEARCH_ROWS rows deep.
  var FOCUS_PAGE = 200;
  var FOCUS_SEARCH_ROWS = 1000;

  // ---------- Auth / API ----------
  // Token storage, claim decoding, the fetch wrapper and silent token renewal
  // all live in auth.js; this page only reacts to what they report.

  // ---------- Tenant scope ----------
  // Every tenant resource hangs under /api/v1/tenants/{id}/. A user belongs to
  // exactly one tenant and never names it: "me" is the alias the server resolves
  // from the token. An administrator belongs to none and must name one, which it
  // does with the selector or with ?tenant=<id> on the address.
  var TENANT_ME = "me";

  function accountRole() {
    var claims = UnicaAuth.decodeClaims(UnicaAuth.accessToken());
    return claims && typeof claims.role === "string" ? claims.role : "";
  }

  function isAdmin() { return accountRole() === "admin"; }

  // The tenant named on the address. Only an administrator can act on a tenant
  // other than its own, so for anyone else the parameter means nothing.
  function requestedTenant() {
    if (!isAdmin()) return "";
    var m = /[?&]tenant=([^&]*)/.exec(window.location.search);
    try { return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : ""; } catch (e) { return ""; }
  }

  // The path segment this page addresses its tenant by.
  function tenantSegment() {
    if (!isAdmin()) return TENANT_ME;
    return state.currentTenant ? String(state.currentTenant.id) : "";
  }

  function tenantPath(suffix) {
    return "/api/v1/tenants/" + encodeURIComponent(tenantSegment()) + suffix;
  }

  function queryParam(name) {
    var m = new RegExp("[?&]" + name + "=([^&]*)").exec(window.location.search);
    try { return m ? decodeURIComponent(m[1].replace(/\+/g, " ")) : ""; } catch (e) { return ""; }
  }

  // Rewrites the address in place so a reload, a copied link or the top bar
  // sees what the page is showing. Empty values drop the parameter.
  function setQuery(params) {
    var url = new URL(window.location.href);
    Object.keys(params).forEach(function (k) {
      if (params[k]) url.searchParams.set(k, params[k]);
      else url.searchParams.delete(k);
    });
    var next = url.pathname + url.search + url.hash;
    if (next !== window.location.pathname + window.location.search + window.location.hash) {
      window.history.replaceState(null, "", next);
    }
  }

  // The top bar is built from the session as it is now, so it is mounted
  // after sign-in and taken down on sign-out; a tenant switch goes through
  // UnicaUI.topbar.setTenant.
  function mountTopbar() {
    UnicaUI.topbar.refresh({ title: "质量复核" });
  }

  // Drops this tab's pair only. A remembered account stays in the vault: a
  // renewal that failed once must not undo "remember me". The logout button
  // is the one place that forgets an account, and it calls logout() first.
  function showLogin(message) {
    UnicaAuth.dropTab();
    UnicaUI.topbar.unmount();
    els.appView.hidden = true;
    els.userInfo.hidden = true;
    els.loginView.hidden = false;
    if (message) {
      els.loginError.textContent = message;
      els.loginError.style.display = "block";
    }
  }

  function showApp() {
    els.loginView.hidden = true;
    els.appView.hidden = false;
    els.userInfo.hidden = false;
    if (!UnicaUI.topbar.current()) mountTopbar();
  }

  // A refusal names the permission this page needed; the shared client only
  // carries the server's wording, so the page supplies its own here.
  function errorText(err) {
    if (err && err.status === 403) {
      return "无权限：" + ((err.data && err.data.error) || "当前账号不能复核违规证据");
    }
    return (err && err.message) || "请求失败";
  }

  function reportError(prefix, err) {
    if (err.message === "unauthorized") return;
    toast(prefix + ": " + errorText(err), "error");
  }

  // ---------- Login ----------
  els.loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    els.loginError.style.display = "none";
    els.loginSubmit.disabled = true;
    els.loginSubmit.textContent = "登录中…";

    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;
    var remember = els.remember.checked;

    UnicaAuth.login(email, password, remember)
      .then(function () {
        els.userEmail.textContent = email;
        showApp();
        bootstrap();
      })
      .catch(function (err) {
        els.loginError.textContent = err.message || "登录失败，请检查网络";
        els.loginError.style.display = "block";
      })
      .finally(function () {
        els.loginSubmit.disabled = false;
        els.loginSubmit.textContent = "登 录";
      });
  });

  // Signing out means being forgotten: the account also leaves the remembered
  // list. A session that merely expired takes the onSessionLost path instead.
  els.logoutBtn.addEventListener("click", function () {
    UnicaAuth.logout();
    showLogin();
  });

  // ---------- Bootstrap after login ----------
  function bootstrap() {
    var focus = queryParam("focus");
    if (/^\d+$/.test(focus)) {
      state.focusId = focus;
      state.focusPending = true;
    }
    loadTenants();
  }

  // The tenant roster is an administrator surface; a user reads its one tenant
  // through the "me" alias, which is why the two roles load different addresses.
  function loadTenants() {
    if (!isAdmin()) {
      return UnicaAuth.api("/api/v1/tenants/" + TENANT_ME)
        .then(function (tenant) {
          state.tenants = tenant ? [tenant] : [];
          renderTenantOptions();
        })
        .catch(function (err) { reportError("加载租户失败", err); });
    }
    return UnicaAuth.api("/api/v1/tenants")
      .then(function (data) {
        state.tenants = Array.isArray(data) ? data : [];
        renderTenantOptions();
      })
      .catch(function (err) { reportError("加载租户失败", err); });
  }

  function renderTenantOptions() {
    // A user has one tenant and nothing to choose between, so the selector is
    // an administrator's control only.
    els.plField.hidden = !isAdmin();

    if (state.tenants.length === 0) {
      els.plSelect.innerHTML = '<option value="">暂无租户</option>';
      els.noPlHint.innerHTML = '还没有租户，先去<a href="./admin.html">开户 →</a>';
      els.noPlHint.hidden = false;
      els.northstarCard.hidden = true;
      els.queueCard.hidden = true;
      return;
    }
    els.plSelect.innerHTML = state.tenants.map(function (pl) {
      return '<option value="' + escapeHtml(pl.id) + '">' + escapeHtml(pl.display_name || pl.name) + "</option>";
    }).join("");
    // The address may name the tenant to act on; otherwise the first one, since
    // this page is meaningless without one.
    var initial = findTenant(requestedTenant()) || state.tenants[0];
    els.plSelect.value = String(initial.id);
    selectTenant(els.plSelect.value);
  }

  els.plSelect.addEventListener("change", function () {
    // A focus link names a row of the tenant it was made for.
    clearFocus();
    selectTenant(els.plSelect.value);
  });

  function selectTenant(id) {
    state.currentTenant = findTenant(id);
    // An administrator's choice goes on the address, where the top bar and
    // every link built from it read the tenant.
    if (state.currentTenant) UnicaUI.topbar.setTenant(state.currentTenant.id);
    if (!state.currentTenant) {
      els.northstarCard.hidden = true;
      els.queueCard.hidden = true;
      els.noPlHint.hidden = false;
      return;
    }
    els.noPlHint.hidden = true;
    els.northstarCard.hidden = false;
    els.queueCard.hidden = false;
    // Kind options are derived from the loaded rows, so they belong to one line.
    state.knownKinds = [];
    state.kind = "";
    renderKindOptions();
    resetPaging();
    loadViolations();
    loadNorthstar();
  }

  function findTenant(id) {
    for (var i = 0; i < state.tenants.length; i++) {
      if (String(state.tenants[i].id) === String(id)) return state.tenants[i];
    }
    return null;
  }

  // ---------- Filters ----------
  var statusChips = UnicaUI.chips(els.statusChips, {
    onChange: function (value) {
      state.status = value || "";
      resetPaging();
      loadViolations();
    }
  });

  function syncStatusChips() {
    statusChips.set(state.status);
  }

  els.kindSelect.addEventListener("change", function () {
    state.kind = els.kindSelect.value;
    resetPaging();
    loadViolations();
  });

  els.enforcedOnly.addEventListener("change", function () {
    state.enforcedOnly = els.enforcedOnly.checked;
    resetPaging();
    loadViolations();
  });

  els.refreshBtn.addEventListener("click", function () {
    if (state.currentTenant) {
      loadViolations();
      loadNorthstar();
    } else {
      loadTenants();
    }
  });

  els.prevBtn.addEventListener("click", function () {
    if (state.offset <= 0) return;
    state.offset = Math.max(0, state.offset - PAGE_SIZE);
    loadViolations();
  });

  els.nextBtn.addEventListener("click", function () {
    if (state.offset + PAGE_SIZE >= state.total) return;
    state.offset += PAGE_SIZE;
    loadViolations();
  });

  function resetPaging() {
    state.offset = 0;
    state.expanded = {};
  }

  function clearFilters() {
    state.status = "pending";
    state.kind = "";
    state.enforcedOnly = false;
    els.kindSelect.value = "";
    els.enforcedOnly.checked = false;
    syncStatusChips();
    resetPaging();
    loadViolations();
  }

  // A non-default filter set is the difference between "nothing matched" and
  // "this product line has produced nothing at all".
  function filtersActive() {
    return state.status !== "pending" || state.kind !== "" || state.enforcedOnly;
  }

  // ---------- Load ----------
  function violationsPath(params) {
    var qs = [];
    Object.keys(params).forEach(function (k) {
      var v = params[k];
      // Empty filters are omitted entirely rather than sent as blanks.
      if (v === "" || v === null || v === undefined) return;
      qs.push(encodeURIComponent(k) + "=" + encodeURIComponent(v));
    });
    return tenantPath("/violations") + (qs.length ? "?" + qs.join("&") : "");
  }

  function loadViolations() {
    if (!state.currentTenant) return Promise.resolve();
    state.loading = true;
    els.emptyBox.hidden = true;
    els.pager.hidden = true;
    els.tableWrap.hidden = false;
    els.tbody.innerHTML = '<tr><td colspan="7" class="loading-text">加载中…</td></tr>';

    var plId = state.currentTenant.id;
    return UnicaAuth.api(violationsPath({
      kind: state.kind,
      review_status: state.status,
      enforced: state.enforcedOnly ? "true" : "",
      limit: PAGE_SIZE,
      offset: state.offset
    }))
      .then(function (data) {
        if (String(plId) !== String(state.currentTenant.id)) return; // stale response
        data = data || {};
        state.items = Array.isArray(data.items) ? data.items : [];
        state.total = typeof data.total === "number" ? data.total : state.items.length;

        // The queue can shrink between pages as rows are reviewed out of the
        // filter, stranding the operator past the last page. Snap back instead.
        if (state.items.length === 0 && state.offset > 0) {
          var lastOffset = Math.floor(Math.max(0, state.total - 1) / PAGE_SIZE) * PAGE_SIZE;
          if (lastOffset < state.offset) {
            state.offset = lastOffset;
            return loadViolations();
          }
        }

        collectKinds(state.items);
        render();
        if (state.items.length === 0) probeEmptyReason();
        if (state.focusPending) {
          applyFocus();
        } else {
          announce(state.items.length
            ? "已载入复核记录，第 " + (state.offset + 1) + "–" + (state.offset + state.items.length) + " 条，共 " + state.total + " 条"
            : "没有符合条件的复核记录");
        }
      })
      .catch(function (err) {
        if (err.message === "unauthorized") return;
        announce("加载违规记录失败：" + errorText(err), "assertive");
        els.tbody.innerHTML =
          '<tr><td colspan="7" class="empty-state">加载失败：' + escapeHtml(errorText(err)) + "</td></tr>";
        els.totalPill.className = "uu-pill muted";
        els.totalPill.textContent = "—";
        reportError("加载违规记录失败", err);
      })
      .finally(function () { state.loading = false; });
  }

  // Distinguishes an empty queue from a product line with no ontology activity
  // at all. Only runs when the current page came back empty.
  function probeEmptyReason() {
    var plId = state.currentTenant.id;
    UnicaAuth.api(violationsPath({ limit: 1, offset: 0 }))
      .then(function (data) {
        if (String(plId) !== String(state.currentTenant.id)) return;
        var anyAtAll = data && typeof data.total === "number" ? data.total : 0;
        renderEmptyState(anyAtAll > 0);
      })
      .catch(function () {
        renderEmptyState(true);
      });
  }

  function collectKinds(items) {
    var changed = false;
    items.forEach(function (v) {
      if (v.kind && state.knownKinds.indexOf(v.kind) === -1) {
        state.knownKinds.push(v.kind);
        changed = true;
      }
    });
    if (changed) renderKindOptions();
  }

  function renderKindOptions() {
    var kinds = state.knownKinds.slice();
    // Keep the active filter selectable even if this page holds none of it.
    if (state.kind && kinds.indexOf(state.kind) === -1) kinds.push(state.kind);
    kinds.sort(function (a, b) { return kindLabel(a).localeCompare(kindLabel(b), "zh-CN"); });
    var html = ['<option value="">全部</option>'];
    kinds.forEach(function (k) {
      html.push('<option value="' + escapeHtml(k) + '">' + escapeHtml(kindLabel(k)) + "</option>");
    });
    els.kindSelect.innerHTML = html.join("");
    els.kindSelect.value = state.kind;
  }

  function kindLabel(kind) {
    return KIND_LABELS[kind] || kind || "—";
  }

  // ---------- Quality overview (north-star numbers) ----------
  // A separate request from the review queue above, with its own failure
  // mode: a slow or erroring north-star query must never block the review
  // queue the page exists for, so a failure here only degrades this one card.
  var NORTHSTAR_WINDOW_DAYS = 30;

  function loadNorthstar() {
    if (!state.currentTenant) return Promise.resolve();
    var plId = state.currentTenant.id;
    els.northstarGrid.innerHTML = '<div class="loading-text">加载中…</div>';
    return UnicaAuth.api(tenantPath("/quality/northstar?days=" + NORTHSTAR_WINDOW_DAYS))
      .then(function (stats) {
        if (String(plId) !== String(state.currentTenant.id)) return; // stale response
        renderNorthstar(stats || {});
      })
      .catch(function (err) {
        if (err.message === "unauthorized") return;
        els.northstarGrid.innerHTML =
          '<div class="empty-state">加载质量概览失败：' + escapeHtml(errorText(err)) + "</div>";
      });
  }

  function formatPercent(rate) {
    return (rate * 100).toFixed(1) + "%";
  }

  // metricHtml renders one north-star card: a value (muted when the sample
  // has not cleared the floor the server enforces, so "样本不足" never looks
  // like a confident 0%) and, always, the sample size it was computed from --
  // a rate with no sample size next to it is not something this page shows.
  function metricHtml(label, valueText, muted, sampleText, stale) {
    return (
      '<div class="northstar-metric' + (stale ? " stale" : "") + '">' +
      '<div class="metric-label">' + escapeHtml(label) + "</div>" +
      '<div class="metric-value' + (muted ? " muted" : "") + '">' + escapeHtml(valueText) + "</div>" +
      '<div class="metric-sample">' + escapeHtml(sampleText) + "</div>" +
      "</div>"
    );
  }

  function renderNorthstar(stats) {
    els.northstarWindowPill.className = "uu-pill muted";
    els.northstarWindowPill.textContent = (stats.window_days || NORTHSTAR_WINDOW_DAYS) + " 天窗口";

    // Below the server's sample floor the rate is still sent, but a
    // percentage from a handful of conversations is not shown as one: the
    // counts underneath carry what there is.
    var selfServiceShown = stats.self_service_rate != null && !stats.self_service_insufficient;
    var selfServiceValue = selfServiceShown ? formatPercent(stats.self_service_rate) : "样本不足";
    var selfServiceSample = "会话 " + (stats.conversations_total || 0) +
      "，转人工 " + (stats.handoff_conversations || 0) +
      "（可削减 " + (stats.reducible_handoff_conversations || 0) +
      " / 强制 " + (stats.forced_handoff_conversations || 0) + "）" +
      (stats.self_service_insufficient ? " · 样本不足（需 ≥30 会话），暂不计算比率" : "");

    var complianceShown = stats.compliance_false_positive_rate != null && !stats.compliance_insufficient;
    var complianceValue = complianceShown ? formatPercent(stats.compliance_false_positive_rate) : "样本不足";
    var complianceSample = "已复核拦截 " + (stats.enforced_reviewed || 0) +
      " 条，其中误报 " + (stats.enforced_false_positive || 0) + " 条" +
      (stats.compliance_insufficient ? " · 样本不足（需 ≥20 条已复核），暂不计算比率" : "");

    var factValue, factSample, factStale;
    // A missing version is read as "nothing published" too: the field is
    // omitted when there is none, and "vundefined" says nothing true.
    if (stats.fact_stale_insufficient || stats.active_ontology_version == null) {
      factValue = "尚未发布";
      factSample = "该租户还没有生效的本体版本";
      factStale = false;
    } else {
      factStale = !!stats.fact_stale;
      factValue = (stats.active_version_age_days != null ? stats.active_version_age_days : "—") + " 天";
      factSample = "生效版本 v" + stats.active_ontology_version +
        (factStale ? " · 已超过 90 天未重新确认，建议复核事实是否仍然准确" : "");
    }

    els.northstarGrid.innerHTML = [
      metricHtml("自助解决率 ↑", selfServiceValue, !selfServiceShown, selfServiceSample, false),
      metricHtml("合规误报率 ↓", complianceValue, !complianceShown, complianceSample, false),
      metricHtml("事实新鲜度 ↓", factValue, stats.fact_stale_insufficient, factSample, factStale)
    ].join("");
  }

  // ---------- Render ----------
  function render() {
    renderTotalPill();
    if (state.items.length === 0) {
      els.tableWrap.hidden = true;
      els.pager.hidden = true;
      // The empty copy itself is decided by probeEmptyReason.
      return;
    }
    els.emptyBox.hidden = true;
    els.tableWrap.hidden = false;
    els.tbody.innerHTML = state.items.map(rowHtml).join("");
    bindRows();
    renderPager();
  }

  function renderTotalPill() {
    var label = state.status ? STATUS_LABELS[state.status] || state.status : "全部";
    els.totalPill.className = "uu-pill " + (state.total > 0 ? "info" : "muted");
    els.totalPill.textContent = label + " " + state.total + " 条";
  }

  function renderPager() {
    var from = state.offset + 1;
    var to = state.offset + state.items.length;
    els.pageCount.textContent = "第 " + from + "–" + to + " 条 / 共 " + state.total + " 条";
    els.prevBtn.disabled = state.offset <= 0;
    els.nextBtn.disabled = state.offset + PAGE_SIZE >= state.total;
    els.pager.hidden = false;
  }

  function renderEmptyState(hasAnyViolations) {
    els.tableWrap.hidden = true;
    els.pager.hidden = true;
    if (!hasAnyViolations) {
      els.emptyBox.className = "empty-state";
      els.emptyBox.innerHTML =
        '<span class="big">🗂️</span>' +
        '<span class="title">该租户还没有任何本体校验记录</span><br />' +
        '需要先在<a href="./ontology.html">确定性事实</a>发布本体，并把回答校验开到 shadow 或 enforce，' +
        "AI 回答与本体冲突时才会在这里留下证据。";
    } else if (state.status === "pending" && !state.kind && !state.enforcedOnly) {
      els.emptyBox.className = "empty-state celebrate";
      els.emptyBox.innerHTML =
        '<span class="big">🎉</span>' +
        '<span class="title">复核队列已清空</span><br />' +
        "当前没有待复核的证据。切换到「全部」可以回看已复核的记录。";
    } else {
      els.emptyBox.className = "empty-state";
      els.emptyBox.innerHTML =
        '<span class="title">没有符合筛选条件的记录</span><br />' +
        "换一组筛选条件，或清除筛选查看待复核队列。" +
        '<div class="actions-row"><button id="clear-filters-btn">清除筛选</button></div>';
      var btn = document.getElementById("clear-filters-btn");
      if (btn) btn.addEventListener("click", clearFilters);
    }
    els.emptyBox.hidden = false;
  }

  function rowHtml(v) {
    var id = String(v.id);
    var expanded = !!state.expanded[id];
    var status = v.review_status || "pending";
    var statusPill = '<span class="uu-pill ' + (STATUS_PILLS[status] || "muted") + '">' +
      escapeHtml(STATUS_LABELS[status] || status) + "</span>";
    var enforcedPill = v.enforced
      ? '<span class="uu-pill bad">拦截</span>'
      : '<span class="uu-pill muted">影子</span>';

    return (
      '<tr class="v-row' + (expanded ? " expanded" : "") + (id === state.focusId ? " focused" : "") +
      '" data-id="' + escapeHtml(id) + '"' + (id === state.focusId ? ' tabindex="-1" aria-current="true"' : "") + ">" +
      "<td>" + escapeHtml(formatDate(v.created_at)) + "</td>" +
      '<td><span class="uu-pill" title="' + escapeHtml(v.kind || "") + '">' + escapeHtml(kindLabel(v.kind)) + "</span></td>" +
      '<td class="prop">' +
      (v.property ? '<code title="' + escapeHtml(v.property) + '">' + escapeHtml(v.property) + "</code>" : "—") +
      "</td>" +
      '<td class="msg">' + escapeHtml(v.message || "—") + "</td>" +
      "<td>" + enforcedPill + "</td>" +
      "<td>" + statusPill + "</td>" +
      '<td class="actions-cell"><div class="row-actions">' +
      '<button data-act="toggle">' + (expanded ? "收起" : "展开") + "</button>" +
      reviewButtonsHtml(status, v.kind) +
      "</div></td>" +
      "</tr>" +
      '<tr class="detail-row" data-detail="' + escapeHtml(id) + '"' + (expanded ? "" : " hidden") + ">" +
      '<td colspan="7">' + detailHtml(v) + "</td></tr>"
    );
  }

  function reviewButtonsHtml(status, kind) {
    if (status && status !== "pending") {
      return '<button data-act="review" data-status="pending">重开</button>';
    }
    return (
      (isFirewallKind(kind) ? "" : '<button data-act="review" data-status="ontology_wrong">本体错了</button>') +
      '<button data-act="review" data-status="model_wrong">模型错了</button>' +
      '<button data-act="review" data-status="false_positive">误报</button>'
    );
  }

  function detailHtml(v) {
    var meta = [];
    if (v.property) meta.push("属性 <code>" + escapeHtml(v.property) + "</code>");
    if (v.scope) meta.push("场景 <code>" + escapeHtml(v.scope) + "</code>");
    // Firewall rows carry no ontology version (stored NULL, served as 0), so
    // only a real version number is shown.
    if (v.ontology_version != null && v.ontology_version !== "" && v.ontology_version !== 0) {
      meta.push("本体版本 <code>v" + escapeHtml(v.ontology_version) + "</code>");
    }
    if (v.reviewed_by) {
      meta.push("复核人 " + escapeHtml(v.reviewed_by) +
        (v.reviewed_at ? " · " + escapeHtml(formatDate(v.reviewed_at)) : ""));
    }

    var convo = v.conversation_id
      ? "会话 ID <code>" + escapeHtml(v.conversation_id) + "</code>" +
        '<button class="copy-btn" data-act="copy" data-value="' + escapeHtml(v.conversation_id) + '">复制</button>'
      : "";

    return (
      '<div class="detail">' +
      '<div class="detail-cols">' +
      '<div class="detail-col got"><h4>AI 回答给出（got）</h4>' +
      valueHtml(v.got) + "</div>" +
      '<div class="detail-col want"><h4>本体要求（want）</h4>' +
      valueHtml(v.want) + "</div>" +
      "</div>" +
      (v.evidence
        ? '<div class="evidence"><span class="lead">证据句</span><q>' + escapeHtml(v.evidence) + "</q></div>"
        : "") +
      '<div class="detail-meta">' +
      (convo ? "<span>" + convo + "</span>" : "") +
      meta.map(function (m) { return "<span>" + m + "</span>"; }).join("") +
      "</div>" +
      "</div>"
    );
  }

  function valueHtml(value) {
    if (value === null || value === undefined || value === "") {
      return '<div class="detail-val empty">未提供</div>';
    }
    return '<div class="detail-val">' + escapeHtml(value) + "</div>";
  }

  function bindRows() {
    var rows = els.tbody.querySelectorAll("tr.v-row");
    for (var i = 0; i < rows.length; i++) {
      rows[i].addEventListener("click", onRowClick);
    }
    var buttons = els.tbody.querySelectorAll("button[data-act]");
    for (var j = 0; j < buttons.length; j++) {
      buttons[j].addEventListener("click", onActionClick);
    }
  }

  function onRowClick(e) {
    if (e.target.closest("button")) return;
    toggleDetail(this.dataset.id);
  }

  function onActionClick(e) {
    e.stopPropagation();
    var btn = e.currentTarget;
    var act = btn.dataset.act;
    if (act === "copy") {
      copyText(btn.dataset.value);
      return;
    }
    var row = btn.closest("tr");
    var id = row && row.dataset.id;
    if (!id) return;
    if (act === "toggle") toggleDetail(id);
    else if (act === "review") reviewViolation(id, btn.dataset.status, btn);
  }

  function toggleDetail(id) {
    var open = !state.expanded[id];
    if (open) state.expanded[id] = true;
    else delete state.expanded[id];

    var row = els.tbody.querySelector('tr.v-row[data-id="' + cssEscape(id) + '"]');
    var detail = els.tbody.querySelector('tr.detail-row[data-detail="' + cssEscape(id) + '"]');
    if (!row || !detail) return;
    detail.hidden = !open;
    row.classList.toggle("expanded", open);
    var toggleBtn = row.querySelector('button[data-act="toggle"]');
    if (toggleBtn) toggleBtn.textContent = open ? "收起" : "展开";
  }

  // ---------- Focus (?focus=<id>) ----------
  // Called after a page of rows has rendered while a focus is pending. A row
  // on this page is opened, scrolled to and marked; otherwise the list is
  // searched across every review status for the page that holds it.
  function applyFocus() {
    var id = state.focusId;
    var found = state.items.some(function (v) { return String(v.id) === id; });
    if (found) {
      state.focusPending = false;
      if (!state.expanded[id]) toggleDetail(id);
      var row = els.tbody.querySelector('tr.v-row[data-id="' + cssEscape(id) + '"]');
      if (row) {
        row.scrollIntoView({ block: "center", behavior: UnicaUI.reducedMotion() ? "auto" : "smooth" });
        try { row.focus({ preventScroll: true }); } catch (e) { row.focus(); }
        UnicaUI.flashRow(row);
      }
      announce("已定位到复核记录 #" + id);
      return;
    }
    if (state.focusPending === "searched") {
      notFound();
      return;
    }
    state.focusPending = "searched";
    locateFocus(0);
  }

  function locateFocus(offset) {
    var plId = state.currentTenant.id;
    UnicaAuth.api(violationsPath({ limit: FOCUS_PAGE, offset: offset }))
      .then(function (data) {
        if (!state.currentTenant || String(plId) !== String(state.currentTenant.id) || !state.focusPending) return;
        var items = (data && Array.isArray(data.items)) ? data.items : [];
        var total = data && typeof data.total === "number" ? data.total : items.length;
        for (var i = 0; i < items.length; i++) {
          if (String(items[i].id) === state.focusId) {
            // The row sits at offset + i of the unfiltered list: show that page
            // with every filter cleared so it is on screen.
            state.status = "";
            state.kind = "";
            state.enforcedOnly = false;
            els.kindSelect.value = "";
            els.enforcedOnly.checked = false;
            syncStatusChips();
            state.offset = Math.floor((offset + i) / PAGE_SIZE) * PAGE_SIZE;
            state.expanded = {};
            loadViolations();
            return;
          }
        }
        var next = offset + items.length;
        if (items.length && next < total && next < FOCUS_SEARCH_ROWS) locateFocus(next);
        else notFound();
      })
      .catch(function (err) {
        state.focusPending = false;
        reportError("定位复核记录失败", err);
      });
  }

  function notFound() {
    var id = state.focusId;
    clearFocus();
    toast("没有在最近 " + FOCUS_SEARCH_ROWS + " 条记录中找到复核记录 #" + id + "，可能已被删除或属于其他租户", "warn");
  }

  function clearFocus() {
    state.focusId = "";
    state.focusPending = false;
    setQuery({ focus: "" });
  }

  // ---------- Review ----------
  function reviewViolation(id, status, btn) {
    var row = btn.closest("tr");
    setRowBusy(row, true);
    var original = btn.textContent;
    btn.textContent = "提交中…";

    UnicaAuth.api(tenantPath("/violations/" + encodeURIComponent(id) + "/review"), {
      method: "PUT",
      body: JSON.stringify({ status: status })
    })
      .then(function (item) {
        if (!item || item.id == null) throw new Error("复核响应异常");
        replaceItem(item);
        if (status === "ontology_wrong") {
          var ontologyHref = "./ontology.html?tenant=" + encodeURIComponent(tenantSegment()) +
            (item.property ? "&property=" + encodeURIComponent(item.property) : "");
          toast("已标记为「本体错了」。请修正本体并重新发布，同类回答才会真正停止。", "success", {
            href: ontologyHref,
            text: "前往确定性事实 →"
          });
        } else if (status === "pending") {
          toast("已重开，回到待复核队列", "success");
        } else {
          toast("已标记为「" + (STATUS_LABELS[status] || status) + "」", "success");
        }
      })
      .catch(function (err) {
        btn.textContent = original;
        setRowBusy(row, false);
        reportError("复核失败", err);
      });
  }

  function setRowBusy(row, busy) {
    if (!row) return;
    var buttons = row.querySelectorAll("button");
    for (var i = 0; i < buttons.length; i++) buttons[i].disabled = busy;
  }

  // Re-renders the whole page body so the row picks up its new status pill and
  // action set while keeping every expanded panel open.
  function replaceItem(item) {
    for (var i = 0; i < state.items.length; i++) {
      if (String(state.items[i].id) === String(item.id)) {
        state.items[i] = item;
        break;
      }
    }
    els.tbody.innerHTML = state.items.map(rowHtml).join("");
    bindRows();
  }

  // ---------- Clipboard ----------
  // Falls back to a temporary textarea because the portal is often served over
  // plain HTTP, where the async clipboard API is unavailable.
  function copyText(text) {
    if (!text) return;
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text)
        .then(function () { toast("已复制会话 ID", "success"); })
        .catch(function () { legacyCopy(text); });
      return;
    }
    legacyCopy(text);
  }

  function legacyCopy(text) {
    var ta = document.createElement("textarea");
    ta.value = text;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
    ta.remove();
    toast(ok ? "已复制会话 ID" : "复制失败，请手动选择", ok ? "success" : "warn");
  }

  // ---------- Utils ----------
  function formatDate(iso) {
    if (!iso) return "—";
    try {
      var d = new Date(iso);
      if (isNaN(d.getTime())) return iso;
      return d.toLocaleString("zh-CN", { hour12: false });
    } catch (e) {
      return iso;
    }
  }

  function escapeHtml(str) {
    return String(str == null ? "" : str).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Row ids come from the server; quote them before use in a selector.
  function cssEscape(str) {
    return String(str).replace(/["\\]/g, "\\$&");
  }

  // ---------- Init ----------
  // Fires once per lost-session episode, however many requests failed together,
  // and only after renewal has been tried and refused.
  UnicaAuth.onSessionLost(function () {
    showLogin("登录已过期，请重新登录");
  });

  syncStatusChips();
  if (UnicaAuth.bootstrapTab()) {
    showApp();
    bootstrap();
  } else {
    showLogin();
  }
})();
</script>
