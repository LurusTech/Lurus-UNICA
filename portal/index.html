<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNICA 统一管理门户</title>
<style>
  /* Lurus brand tokens — source: shared/lurus-design/tokens.css (light), manual vendor copy */
  :root {
    --lt-paper: #F5F2E8;
    --lt-bg:    #E8E4D6;
    --lt-ink:   #14130F;
    --lt-rule:  #D6D2C2;
    --lt-ok:    #1F7A4F;
    --lt-warn:  #B8821F;
    --lt-err:   #B3392B;
    --lt-info:  #2D4A8A;
    --lt-accent: #FF5D1F;
    /* Accent is theme-invariant, so its foreground is too. Local token, not in upstream tokens.css. */
    --lt-on-accent: #14130F;
    --lt-font-sans: 'Inter Tight', 'Noto Sans SC', "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  :root {
    --bg: var(--lt-paper);
    --surface: var(--lt-bg);
    --text: var(--lt-ink);
    --text-muted: color-mix(in srgb, var(--lt-ink) 62%, transparent);
    --border: var(--lt-rule);
    --primary: var(--lt-accent);
    --primary-hover: color-mix(in srgb, var(--lt-accent) 82%, var(--lt-ink));
    --ok: var(--lt-ok);
    --bad: var(--lt-err);
    --warn: var(--lt-warn);
    /* Neutral elevation shadow, no brand hue — kept at original value. */
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
  }
  @media (prefers-color-scheme: dark) {
    /* Lurus brand tokens — source: shared/lurus-design/tokens.css (dark), manual vendor copy */
    :root {
      --lt-paper: #14130F;
      --lt-bg:    #0A0908;
      --lt-ink:   #F0EDE4;
      --lt-rule:  #25221C;
      --lt-ok:    #3FA876;
      --lt-warn:  #E0A040;
      --lt-err:   #EE6F5E;
      --lt-info:  #5A7BC7;

      --bg: var(--lt-paper);
      --surface: var(--lt-bg);
      --text: var(--lt-ink);
      --text-muted: color-mix(in srgb, var(--lt-ink) 62%, transparent);
      --border: var(--lt-rule);
      --primary: var(--lt-accent);
      --primary-hover: color-mix(in srgb, var(--lt-accent) 82%, var(--lt-ink));
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.5);
    }
  }
  /* Lurus brand tokens — source: shared/lurus-design/tokens.css (dark), manual vendor copy */
  :root[data-theme="dark"] {
    --lt-paper: #14130F;
    --lt-bg:    #0A0908;
    --lt-ink:   #F0EDE4;
    --lt-rule:  #25221C;
    --lt-ok:    #3FA876;
    --lt-warn:  #E0A040;
    --lt-err:   #EE6F5E;
    --lt-info:  #5A7BC7;

    --bg: var(--lt-paper);
    --surface: var(--lt-bg);
    --text: var(--lt-ink);
    --text-muted: color-mix(in srgb, var(--lt-ink) 62%, transparent);
    --border: var(--lt-rule);
    --primary: var(--lt-accent);
    --primary-hover: color-mix(in srgb, var(--lt-accent) 82%, var(--lt-ink));
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 1px 3px rgba(0, 0, 0, 0.5);
  }
  /* Lurus brand tokens — source: shared/lurus-design/tokens.css (light), manual vendor copy */
  :root[data-theme="light"] {
    --lt-paper: #F5F2E8;
    --lt-bg:    #E8E4D6;
    --lt-ink:   #14130F;
    --lt-rule:  #D6D2C2;
    --lt-ok:    #1F7A4F;
    --lt-warn:  #B8821F;
    --lt-err:   #B3392B;
    --lt-info:  #2D4A8A;

    --bg: var(--lt-paper);
    --surface: var(--lt-bg);
    --text: var(--lt-ink);
    --text-muted: color-mix(in srgb, var(--lt-ink) 62%, transparent);
    --border: var(--lt-rule);
    --primary: var(--lt-accent);
    --primary-hover: color-mix(in srgb, var(--lt-accent) 82%, var(--lt-ink));
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.08);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--lt-font-sans);
  }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 20px clamp(16px, 4vw, 48px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 {
    font-size: 1.25rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.02em;
  }
  header .badge {
    font-size: 0.75rem;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
  }
  main {
    flex: 1;
    padding: clamp(24px, 5vw, 56px) clamp(16px, 4vw, 48px);
    max-width: 460px;
    width: 100%;
    margin: 0 auto;
  }
  button {
    font-family: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); padding: 10px 14px; font-size: 0.9rem;
    transition: background 0.15s, border-color 0.15s;
  }
  button:hover { border-color: var(--primary); }
  button.primary { background: var(--primary); color: var(--lt-on-accent); border-color: var(--primary); }
  button.primary:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.55; cursor: not-allowed; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  label { font-size: 0.85rem; font-weight: 500; display: block; margin-bottom: 6px; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-size: 0.9rem; font-family: inherit;
  }
  .field { margin-bottom: 16px; }
  /* Checkbox rows opt out of the full-width input styling above. */
  label.check {
    display: flex; align-items: center; gap: 8px; cursor: pointer;
    margin-bottom: 0; font-weight: 400; color: var(--text-muted);
  }
  label.check input[type="checkbox"] {
    width: auto; margin: 0; padding: 0; accent-color: var(--primary);
  }

  #login-view {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 32px; box-shadow: var(--shadow);
  }
  #login-view h2 { margin: 0 0 6px; font-size: 1.35rem; }
  #login-view p.sub { color: var(--text-muted); margin: 0 0 22px; font-size: 0.88rem; line-height: 1.5; }
  #login-error {
    background: color-mix(in srgb, var(--bad) 12%, transparent); color: var(--bad);
    border: 1px solid color-mix(in srgb, var(--bad) 40%, transparent);
    border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; margin-bottom: 14px; display: none;
  }
  /* Remembered accounts, offered above the form when more than one is stored
     and the tab cannot pick between them on its own. */
  #accounts-view {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 24px 32px; box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  #accounts-view h2 { margin: 0 0 6px; font-size: 1.15rem; }
  #accounts-view p.sub { color: var(--text-muted); margin: 0 0 18px; font-size: 0.88rem; line-height: 1.5; }
  .account-row { display: flex; align-items: stretch; gap: 8px; margin-bottom: 8px; }
  .account-pick { flex: 1; text-align: left; line-height: 1.35; }
  .account-pick .who { display: block; font-weight: 500; }
  .account-pick .meta { display: block; color: var(--text-muted); font-size: 0.78rem; margin-top: 2px; }
  .account-forget { flex-shrink: 0; padding: 10px 12px; font-size: 0.8rem; color: var(--text-muted); }
  p.helper { color: var(--text-muted); font-size: 0.78rem; line-height: 1.6; margin: 16px 0 0; }
  /* Shown while an existing session is being routed to its home page. */
  #dispatch-view {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 32px; box-shadow: var(--shadow); text-align: center; color: var(--text-muted);
    font-size: 0.9rem;
  }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid color-mix(in srgb, var(--text-muted) 40%, transparent);
    border-top-color: var(--primary);
    animation: spin 0.7s linear infinite;
    display: inline-block; vertical-align: -2px; margin-right: 8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  section.status {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 20px;
    box-shadow: var(--shadow);
    margin-top: 24px;
  }
  section.status h4 {
    margin: 0 0 12px;
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
  }
  .status-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.88rem;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--text-muted);
    flex-shrink: 0;
  }
  .dot.ok { background: var(--ok); }
  .dot.bad { background: var(--bad); }
  .dot.pending { background: var(--warn); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  .status-item .name { font-weight: 500; }
  .status-item .val { color: var(--text-muted); font-size: 0.82rem; margin-left: auto; }
  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 20px;
  }
  [hidden] { display: none !important; }
</style>

<header>
  <h1>UNICA 统一管理门户</h1>
  <span class="badge" id="clock"></span>
</header>

<main>
  <section id="dispatch-view" hidden>
    <span class="spinner"></span>正在进入…
  </section>

  <section id="accounts-view" hidden>
    <h2>已保存的账号</h2>
    <p class="sub">选择一个账号继续，或在下方用其他账号登录。</p>
    <div id="account-list"></div>
    <p class="helper">从已登录的页面右键「在新标签页中打开」，新标签页会沿用原标签页的账号；要换账号，请手动新开一个标签页并粘贴地址。</p>
  </section>

  <section id="login-view" hidden>
    <h2>登录</h2>
    <p class="sub">登录后按账号类型进入对应工作区：管理员进入平台管理，租户用户进入自己的工作台。</p>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
      </div>
      <div class="field">
        <label class="check" for="remember">
          <input id="remember" name="remember" type="checkbox" />
          <span>记住我（7 天内免登录）</span>
        </label>
      </div>
      <button type="submit" class="primary" id="login-submit" style="width:100%">登 录</button>
    </form>
  </section>

  <section class="status">
    <h4>系统状态</h4>
    <div class="status-item" id="status-admin">
      <span class="dot pending"></span>
      <span class="name">管理服务 (admin)</span>
      <span class="val">检测中…</span>
    </div>
  </section>
</main>

<footer>UNICA 统一管理门户</footer>

<script src="./auth.js?v=1"></script>
<script>
(function () {
  "use strict";

  var auth = window.UnicaAuth;
  // Where each kind of account belongs. The server is the authority on what an
  // account may reach; this map only decides which page to open first.
  var HOME_BY_ROLE = { admin: "./admin.html", user: "./home.html" };

  var els = {
    clock: document.getElementById("clock"),
    dispatchView: document.getElementById("dispatch-view"),
    accountsView: document.getElementById("accounts-view"),
    accountList: document.getElementById("account-list"),
    loginView: document.getElementById("login-view"),
    loginForm: document.getElementById("login-form"),
    loginError: document.getElementById("login-error"),
    loginSubmit: document.getElementById("login-submit"),
    remember: document.getElementById("remember"),
    statusAdmin: document.getElementById("status-admin")
  };

  function tick() {
    els.clock.textContent = new Date().toLocaleString("zh-CN", { hour12: false });
  }
  tick();
  setInterval(tick, 1000);

  // ---------- Dispatch ----------
  // The token carries exactly one role and, for a tenant user, the tenant it
  // belongs to. A user without a tenant could not be scoped by any page here,
  // so it is refused at the door instead of landing on an empty workspace.
  function homeFor(claims) {
    if (!claims || typeof claims.role !== "string") return "";
    var target = HOME_BY_ROLE[claims.role];
    if (!target) return "";
    if (claims.role === "user" && !claims.tenant_id) return "";
    return target;
  }

  function dispatch(claims) {
    var target = homeFor(claims);
    if (!target) {
      // Only this tab is cleared: an account that cannot be routed is still an
      // account the visitor asked to be remembered.
      auth.dropTab();
      showLogin("账号未配置有效的角色或所属租户，请联系管理员");
      return false;
    }
    els.loginView.hidden = true;
    els.accountsView.hidden = true;
    els.dispatchView.hidden = false;
    // replace() keeps the login page out of the history, so Back from a
    // workspace does not land on a form that immediately bounces forward again.
    window.location.replace(target);
    return true;
  }

  function showLogin(message) {
    els.dispatchView.hidden = true;
    els.loginView.hidden = false;
    if (message) {
      els.loginError.textContent = message;
      els.loginError.style.display = "block";
    } else {
      els.loginError.style.display = "none";
    }
  }

  // ---------- Saved accounts ----------
  // Second line of a row: what distinguishes one stored account from another
  // once the address is shown. Only the claims travel in the vault, so a tenant
  // is named by its id.
  function describe(entry) {
    if (entry.role === "admin") return "平台管理员";
    if (entry.role === "user") return entry.tenant_id ? "租户 " + entry.tenant_id : "租户用户";
    return entry.role || "";
  }

  // Built from data through textContent, never through innerHTML: an address
  // comes from the vault and must not be able to carry markup into the page.
  function accountRow(entry) {
    var row = document.createElement("div");
    row.className = "account-row";

    var pick = document.createElement("button");
    pick.type = "button";
    pick.className = "account-pick";

    var who = document.createElement("span");
    who.className = "who";
    who.textContent = entry.email || entry.user_id;
    pick.appendChild(who);

    var meta = document.createElement("span");
    meta.className = "meta";
    meta.textContent = describe(entry);
    pick.appendChild(meta);

    // The entry is already in the vault, so adopting it copies the pair into
    // this tab without changing what is remembered.
    pick.addEventListener("click", function () {
      dispatch(auth.adoptPair(entry));
    });

    var forget = document.createElement("button");
    forget.type = "button";
    forget.className = "account-forget";
    forget.textContent = "忘记";
    forget.setAttribute("aria-label", "忘记 " + (entry.email || entry.user_id));
    forget.addEventListener("click", function () {
      auth.forgetAccount(entry.user_id);
      renderAccounts(auth.savedAccounts());
    });

    row.appendChild(pick);
    row.appendChild(forget);
    return row;
  }

  // An emptied list hides the whole section; a list of one is still worth
  // offering, because the alternative is retyping a password for an account
  // this browser already holds.
  function renderAccounts(list) {
    els.accountList.textContent = "";
    if (!list.length) {
      els.accountsView.hidden = true;
      return;
    }
    for (var i = 0; i < list.length; i++) {
      els.accountList.appendChild(accountRow(list[i]));
    }
    els.accountsView.hidden = false;
  }

  // ---------- Login ----------
  els.loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    els.loginError.style.display = "none";
    els.loginSubmit.disabled = true;
    els.loginSubmit.textContent = "登录中…";

    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    auth.login(email, password, els.remember.checked)
      .then(function (claims) {
        dispatch(claims);
      })
      .catch(function (err) {
        els.loginError.textContent = err.message || "登录失败，请检查网络";
        els.loginError.style.display = "block";
      })
      .finally(function () {
        els.loginSubmit.disabled = false;
        els.loginSubmit.textContent = "登 录";
      });
  });

  // ---------- Service status ----------
  // Relative path, so the check works behind any same-origin reverse proxy.
  // Any network error, non-2xx status, or timeout counts as unavailable, so the
  // indicator never hangs when the service is down.
  function probe(url) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, 4000);
    return fetch(url, { signal: controller.signal, cache: "no-store" })
      .then(function (res) { clearTimeout(timer); return res.ok; })
      .catch(function () { clearTimeout(timer); return false; });
  }

  probe("/healthz").then(function (ok) {
    els.statusAdmin.querySelector(".dot").className = "dot " + (ok ? "ok" : "bad");
    els.statusAdmin.querySelector(".val").textContent = ok ? "运行正常" : "不可用";
  });

  // ---------- Init ----------
  // bootstrapTab adopts a single remembered account on its own; it returns
  // nothing when there are none, when there are several and picking one would
  // be a guess, or when this tab has just been thrown out of a session — a tab
  // that arrived here that way must be offered the choice rather than sent
  // back into the workspace it was refused by. The list below is for all three.
  // A visitor who followed the switch-account link is asking for the door, not
  // for the workspace behind it. Without this a single remembered account is
  // adopted by every new tab and sent straight on, so the login form becomes
  // unreachable and a second account can never be added.
  var wantsSwitch = /[?&]switch=1(&|$)/.test(window.location.search);
  var claims = wantsSwitch ? null : auth.bootstrapTab();
  if (claims) {
    if (!dispatch(claims)) return;
  } else {
    var saved = auth.savedAccounts();
    if (saved.length >= 2 || (saved.length && (auth.wasSessionLost() || wantsSwitch))) renderAccounts(saved);
    showLogin();
  }
})();
</script>
