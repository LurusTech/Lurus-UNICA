# 金融红线包：保本保收益类说法。
#
# 只有字面上就是禁语的说法（保本、保息、稳赚、零风险、承诺收益）扣下转人工。
# 低风险、高收益这类词在风险等级说明里本来就会出现（“该产品风险等级为 R2 中低风险”），
# 扣下它们会误伤正常的风险揭示，所以一律只记录、进复核队列。
#
# 词表只负责把句子拦下或标记给人看，不做任何法律判定，也绝不写入本体的否定项（denies）。
# basis 是起草时引用的依据，条款号与现行有效性均待法务核实。
# 新增“扣下”类词条须经人工评审：redlinepacks_test.go 钉住了每个包的扣下词清单。
id: finance
label: 金融：保本保收益类说法
action: withhold
basis: 《中华人民共和国广告法》第二十五条：有投资回报预期的商品或服务的宣传，不得明示或暗示保本、无风险或保收益（待法务核实现行有效性）
terms:
  # 带 pattern 的词条，term 只是复核队列里显示的名字，匹配以 pattern 为准。
  # “确保本人”“确保本次”不是保本承诺；“担保本金”是，照样命中。捕获组只报告“保本”两个字。
  - term: 保本
    pattern: '(?:^|[^确])(保本)'
    basis: 《中华人民共和国广告法》第二十五条；《关于规范金融机构资产管理业务的指导意见》禁止承诺保本保收益，条款号待核（待法务核实现行有效性）
  - term: 保息
  - term: 稳赚
  - term: 零风险
  - term: 承诺收益
  - term: 低风险
    action: flag
    basis: 风险等级说明中属正常用语，只记录供复核；《金融产品网络营销管理办法》对风险用语的要求是否已正式施行存疑（待法务核实现行有效性）
  - term: 高收益
    action: flag
    basis: 《中华人民共和国广告法》第二十五条：不得对未来收益作保证性承诺；单独出现时多为描述，只记录供复核（待法务核实现行有效性）
  - term: 低利率
    action: flag
    basis: 中国人民银行公告〔2021〕第3号要求贷款产品明示年化利率，单说“低利率”可能不完整，条款号待核（待法务核实现行有效性）
  - term: 秒到账
    action: flag
    basis: 到账时间取决于审核与清算，属对结果的承诺；《金融产品网络营销管理办法》是否已正式施行存疑（待法务核实现行有效性）
