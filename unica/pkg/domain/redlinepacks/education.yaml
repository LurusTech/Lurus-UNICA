# 教育培训红线包：通过考试、升学、拿证类担保。
#
# 只有字面上就是禁语的说法（保过、包过、保证升学、包拿证）扣下转人工，其余只记录、进复核队列。
#
# 词表只负责把句子拦下或标记给人看，不做任何法律判定，也绝不写入本体的否定项（denies）。
# basis 是起草时引用的依据，条款号与现行有效性均待法务核实。
# 新增“扣下”类词条须经人工评审：redlinepacks_test.go 钉住了每个包的扣下词清单。
id: education
label: 教育培训：保过升学类担保
action: withhold
basis: 《中华人民共和国广告法》第二十四条第（一）项：不得对升学、通过考试、获得学位学历或合格证书作明示或暗示的保证性承诺（待法务核实现行有效性）
terms:
  # 带 pattern 的词条，term 只是复核队列里显示的名字，匹配以 pattern 为准。
  # “确保过往”“环保过程”“投保过”不是保过承诺；“确保过关”是，照样命中。捕获组只报告“保过”两个字。
  - term: 保过
    pattern: '(?:^|[^担投环])(保过)(?:[^往程去]|$)'
  # “课程包过期”不是包过承诺。
  - term: 包过
    pattern: '(包过)(?:[^期]|$)'
  - term: 保证升学
  - term: 包拿证
  - term: 保证提分
    pattern: '保证.{0,3}提分'
    action: flag
    basis: 《中华人民共和国广告法》第二十四条第（一）项：不得对培训效果作保证性承诺；表述多变，只记录供复核（待法务核实现行有效性）
  - term: 考不过退费
    pattern: '(?:考不过|没考过|未通过).{0,3}(?:全额)?退(?:费|款)'
    action: flag
    basis: 《中华人民共和国广告法》第二十四条第（一）项：以退费换取的通过承诺可能构成暗示保证；退费政策本身可能合规，只记录供复核（待法务核实现行有效性）
  - term: 命题人员
    pattern: '命题(?:专家|组|老师|人员)'
    action: flag
    basis: 《中华人民共和国广告法》第二十四条第（二）项：不得明示或暗示考试命题人员参与培训（待法务核实现行有效性）
  - term: 押中考题
    pattern: '押中.{0,3}(?:原题|考题|真题)'
    action: flag
    basis: 《中华人民共和国广告法》第二十四条：押题命中的说法暗示通过考试的效果，只记录供复核（待法务核实现行有效性）
