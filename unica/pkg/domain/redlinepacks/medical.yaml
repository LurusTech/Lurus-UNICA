# 医疗健康红线包：疗效断言与代开处方。
#
# 只有字面上就是禁语的说法（根治、包治、治愈率、有效率、为您开具处方）扣下转人工，
# 其余只记录、进复核队列。客服不是医生：给出疗效断言或替人开方都必须由人确认。
#
# 词表只负责把句子拦下或标记给人看，不做任何法律判定，也绝不写入本体的否定项（denies）。
# basis 是起草时引用的依据，条款号与现行有效性均待法务核实。
# 新增“扣下”类词条须经人工评审：redlinepacks_test.go 钉住了每个包的扣下词清单。
id: medical
label: 医疗健康：疗效断言与代开处方
action: withhold
basis: 《中华人民共和国广告法》第十六条第一款第（一）（二）项：不得含有表示功效、安全性的断言或保证，不得说明治愈率或有效率（待法务核实现行有效性）
terms:
  # 带 pattern 的词条，term 只是复核队列里显示的名字，匹配以 pattern 为准。
  # “根治术”“根治性切除”是手术名称，“尚无根治方法”“暂无根治手段”是否认，都不是疗效断言。
  - term: 根治
    pattern: '(?:^|[^无])(根治)(?:[^术性]|$)'
  - term: 包治
  - term: 治愈率
  # “更有效率地处理”说的是办事效率；捕获组只报告“有效率”三个字。
  - term: 有效率
    pattern: '(?:^|[^更很较最])(有效率)(?:[^地]|$)'
  - term: 为您开具处方
    pattern: '(?:为|给|帮)(?:您|你)(?:开具|开)(?:处方|药方)'
    basis: 《互联网诊疗监管细则（试行）》：处方应由接诊医师本人开具，不得由软件自动生成，条款号待核（待法务核实现行有效性）
  - term: 无副作用
    pattern: '无(?:毒)?副作用'
    action: flag
    basis: 《中华人民共和国广告法》第十六条第一款第（一）项：安全性断言，只记录供复核（待法务核实现行有效性）
  - term: 药到病除
    action: flag
  - term: 保证疗效
    action: flag
  - term: 立竿见影
    action: flag
