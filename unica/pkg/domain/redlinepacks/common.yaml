# 通用红线包：无依据的绝对化担保。
#
# 这类说法一旦由客服说出，客户会当成经营者的承诺来主张。词表只负责把句子
# 拦下交给人工确认，不做任何法律判定；basis 一栏是起草时的理由，均待法务核实。
# 行业包（金融、医疗等）另行提供，这里只放与行业无关的担保用语。
id: common
label: 通用：无依据担保
action: withhold
basis: 绝对化担保易被客户主张为经营者承诺（待法务核实）
terms:
  - term: 百分之百保证
  - term: 百分百保证
  - term: 绝对保证
  - term: 绝对没问题
  - term: 肯定没问题
  - term: 包您满意
  - term: 包你满意
  - pattern: 保证.{0,4}一定
    basis: “保证……一定”是对结果的担保，结果并不由客服决定（待法务核实）
