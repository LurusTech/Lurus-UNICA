# 房地产红线包：升值回报、落户入学承诺与位置时间表述。
#
# 全部只记录、进复核队列，不扣下：这些词在介绍项目时常有正当用法（“升值”也可能在否认），
# 由人看过再判断。
#
# 词表只负责把句子标记给人看，不做任何法律判定，也绝不写入本体的否定项（denies）。
# basis 是起草时引用的依据，条款号与现行有效性均待法务核实。
id: realestate
label: 房地产：升值回报与落户入学承诺
action: flag
basis: 《中华人民共和国广告法》第二十六条：房地产宣传不得含有升值或投资回报的承诺，不得以到达某一参照物的所需时间表示项目位置（待法务核实现行有效性）
terms:
  - term: 升值
  - term: 保值
  - term: 投资回报
  - term: 稳赚
  - term: 包落户
    pattern: '(?:包|保证)(?:落户|入户)'
    basis: 《房地产广告发布规定》：不得含有能够为入住者办理户口、升学等事项的承诺，条款号待核（待法务核实现行有效性）
  - term: 包入学
    pattern: '(?:包|保证).{0,2}(?:入学|上学)'
    basis: 《房地产广告发布规定》：不得含有能够为入住者办理户口、升学等事项的承诺，条款号待核（待法务核实现行有效性）
  - term: 学区房
    basis: 《中华人民共和国广告法》第二十六条：不得对教育设施等市政条件作误导宣传；学区划分以教育部门公布为准（待法务核实现行有效性）
  - term: 距某地仅需几分钟
    pattern: '(?:距|离|到).{1,10}?(?:仅需|只需|只要|仅)[0-9一二三四五六七八九十两半]+分钟'
    basis: 《中华人民共和国广告法》第二十六条：不得以项目到达某一具体参照物的所需时间表示项目位置（待法务核实现行有效性）
