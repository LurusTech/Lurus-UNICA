# 电商零售行业包：绝对化用语、赔付与保修承诺。
#
# 一个行业包 = 红线词表 + 承诺类型 + 对抗用例 + 报告措辞。行业差异只进这里，代码不写行业。
#
# 红线词表全部只记录、进复核队列，不扣下：比价、排名、赔付说法是否成立取决于店铺事实，
# 由人看过再判断。系统不替客服确认价格或排名。
# 承诺类型只是把"包赔、保修、当天发货"这类句子纳入承诺防火墙：句中带数字或绝对化用语、
# 又在店铺事实与知识库里找不到出处时扣下。承诺类型只会让闸门更严，永远不会替任何数字背书。
#
# 词表只负责把句子标记给人看，不做任何法律判定，也绝不写入本体的否定项（denies）。
# basis 是起草时引用的依据，条款号与现行有效性均待法务核实。
id: ecommerce
label: 电商零售：绝对化用语与赔付承诺
action: flag
basis: 《中华人民共和国广告法》第九条第（三）项：不得使用“国家级”“最高级”“最佳”等用语（待法务核实现行有效性）
terms:
  - term: 全网最低
  - term: 最低价
  - term: 史上最低
  - term: 国家级
  - term: 最高级
  - term: 最佳
  - term: 第一品牌
  - term: 销量第一
  - term: 假一赔几
    pattern: '假一赔[0-9一二三四五六七八九十百]+'
    basis: 《中华人民共和国消费者权益保护法》：经营者向消费者作出的承诺应当履行，赔付说法须与店铺实际政策一致，条款号待核（待法务核实现行有效性）
  - term: 终身保修
    pattern: '(?:永久|终身)(?:保修|质保|包换)'
    basis: 《中华人民共和国消费者权益保护法》：经营者向消费者作出的承诺应当履行，保修期限须与实际政策一致，条款号待核（待法务核实现行有效性）

# 承诺类型：店铺会被客户主张的几类承诺。cues 是把句子判为承诺句的线索词，
# 与内置的 退款/赔偿/保证/免费 等并集使用。
commitments:
  - type: 赔付
    cues: [包赔, 先行赔付, 坏单赔, 破损赔, 丢件赔, 假一赔]
  - type: 保修
    cues: [保修, 质保, 只换不修, 换新]
  - type: 发货时效
    cues: [当天发货, 当日发货, 小时内发货, 次日达, 隔日达, 今日达]
  - type: 价格保护
    cues: [保价, 补差价, 退差价, 价保]

# 对抗用例：钉住这个包必须抓到什么、必须放过什么。没有任何本体与知识库作背景，
# 所以 withhold 的含义是"店铺没写下这条事实时，这句话不能直接发出去"。
# 用例只证明包本身可用，体检报告里与真实样本分开统计。
cases:
  - text: 这款是全网最低价，放心拍。
    expect: flag
    note: 绝对化用语只标记，由人核对
  - text: 我们不敢说全网最低，但价格公道。
    expect: clean
    note: 否定在前，不是承诺
  - text: 本店假一赔十。
    expect: flag
    note: 赔付说法是否成立取决于店铺政策，只标记
  - text: 请问支持假一赔十吗？
    expect: clean
    note: 客户的问句不是客服的承诺
  - text: 7天内无理由退货，运费我们全额承担。
    expect: withhold
    note: 全额 + 7天 均无出处
  - text: 本商品质保两年，非人为损坏免费换新。
    expect: withhold
    note: 保修承诺带期限与免费，无出处
  - text: 质保期以商品详情页标注为准。
    expect: clean
    note: 把数字交回事实源，不构成承诺
  - text: 破损包赔，签收后48小时内联系客服即可。
    expect: withhold
    note: 包赔 是本包承诺线索，48小时 无出处
  - text: 今天下单当天发货，顺丰包邮。
    expect: withhold
    note: 发货时效承诺 + 包邮 绝对化，无出处
  - text: 商品不支持七天无理由退货。
    expect: clean
    note: 拒绝不是承诺；数字只计数不扣下
  - text: 这款机器终身保修。
    expect: flag
    note: 保修期限须与实际政策一致，只标记
  - text: 收到货有问题随时联系我们处理。
    expect: clean

report:
  headline: 电商零售：绝对化用语、赔付与保修承诺
  notes:
    - 价格、排名、赔付说法是否成立取决于店铺事实，报告只列出句子，不做判定。
    - 把报告里反复出现的赔付、保修、发货时效写进店铺事实后，同样的话就会被放行。
    - 平台规则（如七天无理由的适用范围）属于事实，闸门不内置，须由店铺写下。
