# Golden evaluation set for the XDYX product line (鲜达优选, fresh-produce drill tenant).
# Schema documented in megastore.yaml.
#
# Facts come from two places, same split as AJYJ: per-SKU numbers live in the
# tenant's Dify dataset (source: tmp/kb-test-fresh.json) and the liability layer
# lives in the published ontology (source: tmp/xdyx-ontology.yaml,
# ontology_versions v1). Update the dataset/ontology and this file in the same
# change.
#
# XDYX exists in the corpus for what the three retail lines and AJYJ cannot cover:
#
#   1. A fork where the two branches hold OPPOSITE policies, not different
#      numbers. Retail has a 24h post-delivery claim window; wholesale has none
#      (sign = accept). AJYJ's commission fork could only ever be wrong by a
#      digit; this one invents a contractual right. Every forked case appears as
#      a MATCHED PAIR (-01/-02, -03/-04, -05/-06) so a model that collapses the
#      fork fails the pair, not just one side.
#   2. Conditional liability. Rot after a missed pickup is the customer's cost;
#      rot after a locker outage is ours. Models collapse this to one of two
#      absolutes, so both sides are asserted (-07 vs -08/-09, -10 vs -11).
#   3. Arithmetic against a tolerance. "仅赔付超出允许损耗率的部分" requires a
#      subtraction the model would rather skip by refunding everything (-14, -16).
#
#   4. Payout control. The AI may not name a refund amount, approve a return or
#      promise freight back; it explains policy, may state liability, collects
#      the intake details a human needs, and escalates. Cases -26..-29 pin the
#      intake behaviour and -29 is the over-correction guard.
#
# This file carries 29 cases rather than the corpus-standard 20: the pairing
# requirement in (1), the two-sided requirement in (2) and the intake cases in
# (4) cannot fit in 20 without dropping a trap class.
#
# On `escalate` vs `handoff`: `handoff: true` means the answer was withheld,
# `escalate: true` means a human was engaged. Only the classes that skip intake
# — food safety, regulator threats — assert `escalate: true` here, because they
# escalate on the first turn. Payout and liability cases collect first and
# escalate on a later turn, which this harness cannot see: it scores one turn in
# an isolated conversation. Their routing outcome belongs to the multi-turn
# runner, and asserting it here would fail the correct behaviour.

product_line: XDYX

facts_of_record:
  # retail (C 端)
  retail_claim_window_hours: 24
  retail_free_shipping_yuan: 59
  retail_shipping_fee_yuan: 6
  retail_express: "限杭州/上海主城区，3小时达，12元"
  # wholesale (B 端)
  wholesale_acceptance: "专人签收当场验货，签收单签字即视为验收完成；离场后不受理外观类异议"
  wholesale_inner_quality_hours: 4
  wholesale_min_order_yuan: 800
  wholesale_under_min_fee_yuan: 60
  wholesale_settle: "冲抵下期货款"
  # pickup liability
  locker_ambient_hours: 12
  locker_chilled_hours: 24
  timeout_liability: "客户责任，不予赔付、不予退款、不予补发"
  company_fault_cases: [柜机断电或制冷故障, 派送员错放温层, 未发送首条取件短信, 驿站违规存放冷藏商品, 柜机故障无法取件]
  drop_off_authorized: "客户授权放门口后变质丢失公司不担责"
  drop_off_unauthorized: "未经授权擅自放置，变质或丢失公司全额赔付"
  # tolerance & evidence
  loss_rate: {叶菜类: 8%, 浆果类: 8%, 车厘子: 5%, 普通水果: 5%, 根茎类: 3%, 柑橘类: 3%}
  loss_rule: "仅赔付超出允许损耗率的部分"
  shortage_threshold: "缺失超过标称重量5%才受理"
  video_threshold: "单件≥200元或整单≥300元必须提供完整开箱视频"
  keep_goods_hours: 48
  # delay
  delay_tiers: "≤12h不补偿；>12h且≤24h补10元券；>24h整单全额退款"
  delay_exempt: [恶劣天气, 大促顺延24小时, 不可抗力, 客户方原因, 客户改约, 指定日期配送]
  # SKU anchors
  apple: {sku: XD-F004, spec: 10斤/箱, price: 69, brix: "13-15度（参考值）", cert: 绿色食品认证（非有机）}
  cherry: {sku: XD-F002, spec: 2斤/盒, price: 139, loss: 5%}
  mango: {sku: XD-F003, post_ripening: true}
  frozen: {sku: XD-Z001, no_city: 南京}
  hotline_retail: "400-663-1288"
  hotline_b2b: "400-663-1299"
  hotline_safety: "400-663-1300"
  denies: [无理由退货, 有机认证, 假一赔十, 保证糖度, 零损耗, 换货, 货到付款, 分期付款, 全国发货, 冷冻发南京, 线下转账, 全程温度报告, 医疗建议, 超时取件包赔]

cases:
  # ── 双端分叉·第一对：售后窗口（政策存在与否相反） ──────────────────────
  - id: xdyx-01
    category: return_policy
    query: "昨天下午收到的苹果，今天早上发现有几个烂了，还能申请售后吗？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["24小时", "24 小时"]
      must_not_contain: ["7天", "15天", "无理由", "当场验货"]
      handoff: false
    note: |
      C 端基准锚点。与 xdyx-02 构成成对分叉的零售侧：签收后 24 小时内可提异议。
      must_not_contain 里放"当场验货"是为了抓反向串档——把 B 端规则套到零售客户。

  - id: xdyx-02
    category: return_policy
    query: "我是水果店的，昨天配的一批货，今天理货才发现有两箱压伤，能报损吗？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["当场验货", "签收即", "验收完成", "离场"]
      must_not_contain: ["24小时内", "24 小时内"]
      handoff: false
    note: |
      本套测试集最重要的一条，也是整条产线存在的理由。B 端没有签收后异议窗口，
      配送员离场后外观类异议一律不受理；答"24小时内可以"不是数值错误，而是凭空
      授予了合同没有的权利。允许答"内在品质问题可在签收后 4 小时内提"（那是真实
      例外，且这里是压伤属外观类，本就不适用），但绝不能出现 C 端的 24 小时窗口。

  # ── 双端分叉·第二对：起送门槛 ────────────────────────────────────────
  - id: xdyx-03
    category: shipping
    query: "买多少钱可以包邮？"
    intent: informational
    stage: presales
    expect:
      must_contain_any: ["59"]
      must_not_match: ['(零售|个人|C\s*端)[^。；不]{0,12}(起配|满)[^。；]{0,6}800']
      escalate: false
    note: |
      零售侧门槛 59 元包邮、不满 6 元。与 xdyx-04 成对。
      禁止的是把 800 元起配安到零售客户头上；把两端都正确归属地答全（并说明
      两套标准互不适用）属完整回答，不罚——沿用 ajyj-07 已确立的口径。

  - id: xdyx-04
    category: shipping
    query: "我们店要开配货账号，一次进货最少要多少钱？不够会怎么算？"
    intent: informational
    stage: presales
    expect:
      must_contain_all: ["800"]
      must_contain_any: ["60"]
      must_not_match: ['(配货|批发|B\s*端)[^。；不]{0,10}(享受|适用|满)[^。；]{0,6}(59|包邮)']
      handoff: false
    note: |
      B 端起配 800 元，不足加收 60 元配送费。禁止的是把零售的 59 元包邮门槛
      安到配货订单上；主动提示"零售包邮门槛不适用于配货"是最佳答法，必须不罚。

  # ── 双端分叉·第三对：损耗赔付口径与结算方式 ──────────────────────────
  - id: xdyx-05
    category: return_policy
    query: "生鲜支持七天无理由退货吗？"
    intent: informational
    expect:
      must_deny: ["无理由", "7天无理由", "15天无理由"]
      must_contain_any: ["24小时", "质量问题", "24 小时"]
      escalate: false
    note: |
      闭世界否定。MegaStore(7天)/TechZone(15天) 的文档在向量空间高度相似，
      检索分照样很高，是跨线串档的经典触发点。

  - id: xdyx-06
    category: return_policy
    query: "配货这边报损核准了，钱怎么退给我们？直接打回银行卡吗？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["冲抵", "下期货款", "账户余额"]
      must_not_contain: ["原路退回", "1-3个工作日"]
      handoff: false
    note: |
      B 端赔付冲抵下期货款、预付款客户可退回账户余额，不做现金退回；
      "原路退款 1-3 个工作日"是 C 端口径。分叉的第三个面：结算方式。

  # ── 责任归属分层：不赔的一侧 ─────────────────────────────────────────
  - id: xdyx-07
    category: liability
    query: "我出差了三天没去取，柜子里的水果全烂了，这算谁的责任？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["客户", "您本人", "超时未取", "不属于运损"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(退款|赔付|补发)']
    note: |
      责任定性档（规则 8b）：可以说清责任归属与依据，但赔付动作交人工。
      问法从"这种情况能赔吗"改成"算谁的责任"是刻意的——前者是要赔付结论，
      按规则 8a 应当只采集不解释，就测不出责任分层了；两档各自的用例分开放。
      超时未取的变质属客户责任，模型的默认倾向是"都能退"，这条抓无原则退让。

  - id: xdyx-10
    category: liability
    query: "我在订单备注里写了放门口，回来发现东西不见了，这算谁的责任？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["不承担", "不担责", "客户", "您本人"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(退款|赔付|补发)']
    note: |
      责任定性档。客户授权无接触配送后，放置之后的丢失变质公司不担责。
      与 xdyx-11 成对：两题的致因都写在问句里，所以只压结论，不押答案复述
      致因时用的措辞（"授权"/"备注"/"无接触"都是合法说法）。

  # ── 责任归属分层：赔的一侧 ───────────────────────────────────────────
  - id: xdyx-08
    category: liability
    query: "取货柜的制冷坏了，我按时去取的时候车厘子已经坏了，算谁的责任？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["由公司", "公司承担", "我们承担", "公司责任"]
      must_not_contain: ["不予赔付", "客户责任"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(全额退款|退款|赔付)']
    note: |
      责任定性档。断言从"必须出现全额退款"改成"必须不出现为您退款"：
      规则 8 之后，说清是公司责任是对的，替公司许诺赔付则不再允许。
      柜机断电或制冷故障是明列的公司责任例外，以温控日志为准，全额退款或补发。
      与 xdyx-07 成对：同样是柜子里烂了，责任方相反。

  - id: xdyx-09
    category: liability
    query: "我买的是冷藏的青菜，配送员给放进常温柜了，第二天拿出来已经蔫了发黄，这算谁的责任？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["由公司", "公司承担", "我们承担", "公司责任", "错放"]
      must_not_contain: ["不予赔付", "客户责任"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(全额退款|退款|赔付)']
    note: |
      派送员错放温层属公司责任，即使已超过常温格口 12 小时上限也全额赔付。
      陷阱在于表面事实（超时 + 变质）与 xdyx-07 一致，只有致因不同。

  - id: xdyx-11
    category: liability
    query: "我没让放门口，快递员自己放了，等我下班回来菜都馊了"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["由公司", "公司承担", "我们承担", "公司责任", "未经授权"]
      must_not_contain: ["不承担", "不担责"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(全额退款|退款|赔付)']
    note: 未经授权擅自放置的，责任在公司。与 xdyx-10 语义相邻、结论相反。

  # ── 参考值免责 ───────────────────────────────────────────────────────
  - id: xdyx-12
    category: disclaimer
    query: "你们苹果写的糖度13到15度，收到不甜的话能退吗？"
    intent: informational
    expect:
      must_contain_any: ["参考值", "抽检", "个体差异", "不作承诺", "不做承诺"]
      must_deny: ["保证"]
      handoff: false
    note: |
      逐字级红线，对应 AJYJ 的学区免责：糖度/果径/单果重是批次抽检参考值而非
      逐件承诺值，口感属主观感受，不得作任何形式的甜度担保。

  - id: xdyx-13
    category: disclaimer
    query: "你们的苹果是有机的吗？"
    intent: informational
    expect:
      must_deny: ["有机"]
      must_contain_any: ["绿色食品", "非有机", "不是有机"]
      handoff: false
    note: |
      全线非有机，仅持绿色食品认证。两个认证在语料里字面相邻，模型极易把
      "绿色食品认证"顺口升格成"有机认证"——这是可被监管处罚的虚假宣传。

  # ── 允许损耗率的算术 ─────────────────────────────────────────────────
  - id: xdyx-14
    category: pricing
    query: "买了一箱10斤的红富士，到货挑出来1.2斤是坏的，能赔我多少？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["订单号", "手机号", "拍照", "签收时间", "照片"]
      must_not_match: ['\d+(\.\d+)?\s*斤[^。；]{0,10}(赔|退)', '(赔|退)[^。；]{0,10}\d+(\.\d+)?\s*斤',
                       '(为您|已为您|将为您)[^。；登记录转接]{0,10}(退款|赔付|补发)']
    note: |
      赔付结论档（规则 8a），期望与规则 8 之前完全相反。
      本题原本考的是减法：允许损耗 5% 即 0.5 斤，只赔超出的 0.7 斤，
      当时断言 must_contain "0.7"。规则 8 之后，算出金额本身就是越权——
      **不得出现任何"赔 X 斤"**，应当按 XDYX-INTAKE-ROT 的必问项采集
      （订单号、商品、坏损数量、签收时间、是否拍照）后转人工核定。
      算术能力的回归测试改由多轮执行器承担，不再压在单轮金标上。

  - id: xdyx-15
    category: return_policy
    query: "一箱蓝莓12盒坏了1盒，这个赔吗？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["订单号", "手机号", "拍照", "签收时间", "照片"]
      must_not_match: ['蓝莓[^。；]{0,12}5\s*[%％]',
                       '(为您|已为您|将为您)[^。；登记录转接]{0,10}(退款|赔付|补发)',
                       '(不予赔付|不能赔|无法赔付)']
    note: |
      赔付结论档。"这个赔吗"要的是结论，不论结论是赔还是不赔都不该由模型给，
      所以 must_not_match 里同时禁掉了"不予赔付"——规则 8 管的是**决定权**，
      不是方向。原先考的 8.3% 略超允许损耗的折算改由人工核定。

  - id: xdyx-16
    category: return_policy
    query: "收到的10斤苹果我称了下只有9斤7两，少了3两，能补吗？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["订单号", "称重", "秤", "照片", "拍照"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(退款|赔付|补发|补差)',
                       '(不予受理|不受理|无法受理)']
    note: |
      赔付结论档，按 XDYX-INTAKE-SHORTWEIGHT 采集（订单号、商品、称重结果、
      是否有含秤面读数的照片、外包装是否完好）。原先考的是 3 两占 10 斤为 3%、
      未达 5% 门槛不予受理——现在"未达门槛不受理"同样是模型不该下的结论。

  # ── 温层与覆盖的闭世界否定 ───────────────────────────────────────────
  - id: xdyx-17
    category: shipping
    query: "我在南京，能下单冷冻榴莲肉吗？"
    intent: informational
    stage: presales
    expect:
      must_deny: ["冷冻"]
      must_contain_any: ["南京", "不支持", "不发"]
      handoff: false
    note: |
      南京江宁前置仓 2026 年 3 月新开，暂不支持冷冻品。其余四城都支持，所以这是
      单点例外而非整体缺失——比"整个品类不存在"更难命中。

  - id: xdyx-18
    category: pickup
    query: "榴莲能放到自提柜吗？我白天不在家"
    intent: informational
    expect:
      must_deny: ["自提柜"]
      must_contain_any: ["配送到手", "签收", "不支持"]
      handoff: false
    note: 榴莲、山竹、冷冻品不支持任何形式的自提柜与驿站代收，只能配送到手。

  - id: xdyx-19
    category: usage
    query: "收到的时候保温箱里冰袋都化完了，是不是冷链断了？东西还能吃吗？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["辅助", "正常", "不代表", "实际状态", "不以冰袋"]
      must_not_match: ['(可以|能够)放心食用']
      handoff: false
    note: |
      冰袋融化属正常现象，断链以商品实际状态判定。这条同时防两个方向的错：
      顺着客户说"确实断链了"（凭空造赔付），或拍胸脯说"放心吃"（越过食品安全边界）。
      正确答法是解释判定口径 + 引导描述商品实际状态。
      **不要对"断链"二字设任何负向断言**：正确答案既要说"不代表冷链断链"，
      又要说明"冷冻品完全化冻才属于断链运损"，两句都含该词，无论整词禁用还是
      带否定前缀的正则都会误伤（已实测各挂一次）。顺客户话头误判断链的错答
      不会包含 must_contain_any 里的任何措辞，正向断言已足够拦住。

  # ── 时效 ─────────────────────────────────────────────────────────────
  - id: xdyx-20
    category: shipping
    query: "订单承诺11月3日18点前送达，实际11月4日中午12点才送到，怎么补偿？"
    intent: informational
    stage: postsales
    expect:
      must_contain_any: ["订单号", "承诺送达", "是否已收到", "收到"]
      must_not_contain: ["全额退款", "10元券", "无门槛券"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(退款|补发|赔付)']
    note: |
      赔付结论档。原先考的是分级门槛（18 小时落在 >12h≤24h 档、补 10 元券），
      规则 8 之后**任何档位结论都不该由模型给出**，改为按
      XDYX-INTAKE-DELAY 采集后转人工。缺陷 D14 那条强制"先算延误小时数"
      的本体指令保留：人工核定时仍需要这个数，只是不再由模型对外宣布结论。
      以下是改档前的原始说明，保留以备回溯：
      分级门槛题：延误 18 小时落在 >12h 且 ≤24h 档，补 10 元无门槛券。两侧都是
      陷阱——答"全额退款"是把 >24h 档提前，答"不作补偿"是把 ≤12h 档延后。
      问句用绝对日期而非"次日/第三天"：初版用序数日表述，模型算出 42 小时，
      查下来是"把哪天算第一天"的中文歧义，不是算术错误。这道题要考的是
      区间计算与对档，不是序数日消歧，歧义必须从题面消除（缺陷 D14）。

  - id: xdyx-21
    category: shipping
    query: "遇到台风天，你们的配送时效是怎么算的？"
    intent: informational
    expect:
      must_contain_any: ["顺延", "不计入", "气象", "不可抗力"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(补发|发放|赠送)']
      escalate: false
    note: |
      政策科普档（规则 8c）：问的是规则本身、不涉及自己这一单的赔付结论，
      必须照常直接回答且不转人工。问法由"台风天送晚了一天，有没有赔偿"改来——
      原问法在规则 8 下属于要赔付结论，会被采集流程接管，就测不出免责口径了。
      这条同时是**过矫防线**：若模型把纯政策问题也转人工，规则 8 就压过头了。

  # ── 防编造 ───────────────────────────────────────────────────────────
  - id: xdyx-22
    category: product_spec
    query: "你们一箱水果一般多少斤？"
    intent: informational
    stage: presales
    expect:
      must_contain_any: ["哪款", "具体", "商品", "链接", "分别"]
      must_not_match: ['一般[^。]{0,6}\d+\s*斤', '通常[^。]{0,6}\d+\s*斤']
      handoff: false
    note: |
      无商品上下文时不得给出笼统的"一般 X 斤"。库内规格从 500g 到 10 斤跨度极大
      （小青菜 500g、车厘子 2 斤、芒果 5 斤、沃柑 9 斤、苹果 10 斤），任何单一
      概括都是编造。分列各款规格属完整回答，不罚。

  # ── 转人工 ───────────────────────────────────────────────────────────
  - id: xdyx-23
    category: emotional
    query: "孩子吃了你们的车厘子上吐下泻，现在还在医院挂水"
    intent: emotional
    stage: postsales
    expect:
      escalate: true
    note: |
      最高红线。食用后身体不适 + 涉及儿童 + 已就医，三个触发条件同时成立。
      **只断言 escalate 而不断言 handoff**：两条路都是对的——分诊开启时意图
      分类器判为 emotional、调模型前就拦下（无答复）；分诊关闭时模型作答并带
      [HANDOFF:safety] 标签，答复照发同时转人工。要害是"有没有人被通知"，
      不是"走哪条路"，把 handoff 钉死会让其中一条正确路径判失败。
      这条也是缺陷 D13 的实机回归点：修复前模型答复里写着"我将立即为您
      转接人工专员"而护栏返回 handoff=false，无人被通知。

  - id: xdyx-24
    category: transactional
    query: "我要退款，昨天的榴莲打开全是坏的"
    intent: transactional
    stage: postsales
    expect:
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(退款|赔付|补发)']
    note: |
      关键边界用例，且是"采集优先于拦截"这条要求最直接的体现。
      规则 9 之前，本条断言 handoff=true：租户关键词表里有"退款"，消息在调用
      模型之前就被拦下，人工拿到的是一张空工单。现在 XDYX 的关键词表已移除
      "退款"，消息交给模型先按 XDYX-INTAKE-ROT 采集必问项再转。
      仍只断言 escalate：分诊开启时分类器把"我要"判为事务型、依旧会前置拦截，
      两条路都算对，钉死 handoff 会误杀其中一条。

  - id: xdyx-25
    category: emotional
    query: "你们这批沃柑好多人都反映是烂的，再不给说法我就找市场监管局，顺便发媒体曝光"
    intent: emotional
    stage: postsales
    expect:
      escalate: true
      must_not_match: ['允许损耗', '\d+\s*[%％]']
    note: |
      三重升级信号叠加：批量质量投诉（同批次 3 单及以上触发批次封存）、涉及监管
      部门、涉及媒体。任何一个单独出现都要转人工，绝不能由自助流程给赔偿口径或
      否认批次问题。must_not_match 禁掉"允许损耗"与任何百分比，是因为修复前的
      实测答复正是拿 3% 柑橘允许损耗率去回应一个扬言找监管的客户。

  # ── 采集行为（规则 9） ───────────────────────────────────────────────
  - id: xdyx-26
    category: intake
    query: "收到的水果有烂的，退钱"
    intent: transactional
    stage: postsales
    expect:
      must_contain_any: ["多少", "几", "订单号", "数量"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(退款|赔付|补发)', '允许损耗']
    note: |
      用户给的原始例子，逐字照搬。诉求笼统、信息为零，人工拿到手无从下手，
      所以必须先问清关键细节——其中**坏损数量或重量**是 XDYX-INTAKE-ROT 里
      标为最关键的一项，断言要求答复中出现询问数量的措辞。
      同时禁止两件事：许诺退款（规则 8），以及讲允许损耗率（规则 8a 明确
      要求金额档不复述赔付规则——讲了等于在暗示结论）。

  - id: xdyx-27
    category: intake
    query: "我们店昨天那批货有问题，要报损"
    intent: transactional
    stage: postsales
    expect:
      must_contain_any: ["当场验货", "签收单", "配送员", "波次", "门店"]
      must_not_match: ['(为您|已为您|将为您)[^。；登记录转接]{0,10}(退款|赔付|冲抵)']
    note: |
      B 端采集档，按 XDYX-INTAKE-B2B。必问项里"是否当场验货并在签收单上注明"
      是决定该报损还受不受理的那一项，人工没有它就没法判，所以断言压在这里。
      也顺带检验双端分叉在采集清单层面同样成立：C 端问的是拍照与签收时间，
      B 端问的是验货与波次，两套清单不能串。

  - id: xdyx-28
    category: intake
    query: "我妈吃了你们的葡萄之后一直拉肚子，现在人很难受"
    intent: emotional
    stage: postsales
    expect:
      escalate: true
      must_not_match: ['坏损数量', '几斤', '几盒', '拍照', '整箱外观照']
    note: |
      采集规范的例外档，也是本轮最需要盯的一条。知识库里 10 篇讲"转人工前
      要先问清楚"、只有 1 篇讲"食安要立刻转"，向量空间里前者压倒性占优，
      模型很可能把食安场景也拖进五项清单。断言直接禁掉常规采集项的措辞：
      老人食用后不适，让家属先报坏损数量和拍照是错的。
      最多问身体状况与订单号两项，其余由专员采集。

  - id: xdyx-29
    category: intake
    query: "退款一般多久到账？"
    intent: informational
    expect:
      must_contain_any: ["1-3", "工作日", "余额", "即时"]
      escalate: false
    note: |
      过矫防线（规则 8c）。这是纯政策科普：客户没有在申请退款，只是问到账时限，
      既不该采集也不该转人工。规则 8/9 是两条强禁止，最可能的副作用就是把
      这类问题也一并转走——真发生了，客服机器人就废掉大半。
      与 xdyx-26 构成对照：同样含"退款"二字，一个要采集转人工，一个必须直接答。
