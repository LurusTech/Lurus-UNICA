# Secret scanning gate — blocks plaintext credentials from entering the repo.
#
# Added after the 2026-08-07 sweep found a live WeChat AppSecret committed in
# docs/dev-environment.md of this PUBLIC repo.
#
# SCOPE NOTE (important, do not "fix" by switching to a full-history scan):
# this gate scans the *working tree* (`--no-git`), not git history. The
# historical commits still contain the leaked values and history rewriting is
# owner-gated, so a history scan would pin CI permanently red and teach people
# to ignore it. Remediation for the already-leaked values is rotation.
# This gate's job is preventing the *next* leak.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.18.4
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install gitleaks
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans every file in the checkout. Exit code 1 == leaks found == gate fails.
      # --redact keeps the secret itself out of the CI log.
      - name: Scan working tree for plaintext secrets
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --config .gitleaks.toml \
            --redact \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --exit-code 1 \
            --verbose

      - name: Upload findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore
          retention-days: 7
